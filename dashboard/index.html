  var container = document.getElementById('ai-panel-container');
  if (currentView !== 'analysis') { container.innerHTML = ''; return; }

  // 内容生产线页面不需要显示全局 stats-row 和 header meta（和阶段 chip 重复）
  document.getElementById('stats-row').style.display = 'none';
  document.getElementById('page-meta').style.display = 'none';

  var content = document.getElementById('content');
  content.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">加载中...</div>';
  container.innerHTML = '';

  try {
    var [jobs, analyses] = await Promise.all([
      fetchJSON('/api/jobs'),
      fetchJSON('/api/analyses'),
    ]);

    var runningJobs = [];
    if (jobs && typeof jobs === 'object') {
      for (var jid in jobs) {
        var j = jobs[jid];
        if (j.type === 'analysis' && j.status === 'running') {
          runningJobs.push({ id: jid, topic: j.topic || '分析中...', progress: j.progress || {}, start_time: j.start_time || '', project_id: j.project_id });
        }
      }
    }

    var analysisList = Array.isArray(analyses) ? analyses : [];
    // 去重：同一 topic 只保留最新的分析（按 timestamp 降序已排好，取第一个）
    var seenTopics = {};
    var dedupedList = [];
    for (var di = 0; di < analysisList.length; di++) {
      var topicKey = (analysisList[di].topic || '').replace(/\s+/g, '').substring(0, 30);
      if (!topicKey || seenTopics[topicKey]) continue;
      seenTopics[topicKey] = true;
      dedupedList.push(analysisList[di]);
    }
    analysisList = dedupedList;
    var allActiveItems = analysisList.filter(function(a) { return (a.total_insights || 0) > 0; });
    // 按阶段过滤
    var activeItems = _pipelineStageFilter ? allActiveItems.filter(function(a) { return (a.stage || 'insights') === _pipelineStageFilter; }) : allActiveItems;
    var failedItems = analysisList.filter(function(a) { return (a.total_insights || 0) === 0 && (a.models_succeeded || 0) === 0; });

    _pipelineData = activeItems;

    var html = '';

    var stageLabels = {analysis: '分析中', insights: '选观点', writing: '写作中', review: '机审中', human_review: '人审', ready: '待发布', published: '已发布'};
    var stageCounts = {};
    for (var si = 0; si < analysisList.length; si++) {
      var st = analysisList[si].stage || 'insights';
      stageCounts[st] = (stageCounts[st] || 0) + 1;
    }
    for (var ri2 = 0; ri2 < runningJobs.length; ri2++) stageCounts['analysis'] = (stageCounts['analysis'] || 0) + 1;

    var stageOrder = ['analysis', 'insights', 'writing', 'review', 'human_review', 'ready', 'published'];
    var stageIcons = {analysis: '🔬', insights: '💡', writing: '✍️', review: '🤖', human_review: '👤', ready: '📤', published: '✅'};

    // 生产线概览：各阶段项目数量（可点击过滤）
    var overviewParts = [];
    var oColors = {analysis:'#3b82f6', insights:'#06b6d4', writing:'#f59e0b', review:'#8b5cf6', human_review:'#ec4899', ready:'#10b981', published:'#059669'};
    // "全部"按钮
    var allCount = analysisList.length + runningJobs.length;
    overviewParts.push('<span style="display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:10px;background:' + (!_pipelineStageFilter ? '#3b82f622' : '#f1f5f9') + ';color:' + (!_pipelineStageFilter ? '#3b82f6' : '#6b7280') + ';font-size:11px;font-weight:600;cursor:pointer;border:1px solid ' + (!_pipelineStageFilter ? '#3b82f6' : 'transparent') + '" onclick="_filterByStage(null)">📊 全部 <strong>' + allCount + '</strong></span>');
    for (var oi = 0; oi < stageOrder.length; oi++) {
      var oStage = stageOrder[oi];
      var oCount = stageCounts[oStage] || 0;
      var isActive = _pipelineStageFilter === oStage;
      var color = oColors[oStage] || '#6b7280';
      overviewParts.push('<span style="display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:10px;background:' + (isActive ? color + '22' : oCount > 0 ? color + '10' : '#f9fafb') + ';color:' + (oCount > 0 ? color : '#d1d5db') + ';font-size:11px;font-weight:600;cursor:' + (oCount > 0 ? 'pointer' : 'default') + ';border:1px solid ' + (isActive ? color : 'transparent') + '" ' + (oCount > 0 ? 'onclick="_filterByStage(\'' + oStage + '\')"' : '') + '>' + (stageIcons[oStage] || '') + ' ' + (stageLabels[oStage] || oStage) + ' <strong>' + oCount + '</strong></span>');
    }
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--border-light)">' + overviewParts.join('') + '</div>';

    html += '<div id="running-jobs-area">';
    if (runningJobs.length > 0) {
      for (var ri = 0; ri < runningJobs.length; ri++) {
        html += _renderRunningJob(runningJobs[ri]);
      }
    }
    html += '</div>';

    if (activeItems.length === 0 && runningJobs.length === 0) {
      html += '<div class="empty-state"><div class="icon">🔬</div>' +
        '<p>暂无内容生产任务</p>' +
        '<p style="font-size:13px;color:var(--text-muted)">去"选题池"确认写作一个话题，自动启动 4 模型并行分析</p></div>';
    } else if (activeItems.length > 0) {
      if (_pipelineActiveTab >= activeItems.length) _pipelineActiveTab = 0;

      html += '<div style="display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:0;overflow-x:auto">';
      for (var ti = 0; ti < activeItems.length; ti++) {
        var tItem = activeItems[ti];
        var isActive = ti === _pipelineActiveTab;
        var tStage = tItem.stage || 'insights';
        var tStageIcon = stageIcons[tStage] || '📄';
        html += '<div class="pipeline-topic-tab" data-tab-idx="' + ti + '" onclick="_switchPipelineTab(' + ti + ')" style="padding:10px 16px;cursor:pointer;font-size:13px;font-weight:' +
          (isActive ? '700' : '400') + ';color:' + (isActive ? 'var(--accent)' : 'var(--text-muted)') +
          ';border-bottom:2px solid ' + (isActive ? 'var(--accent)' : 'transparent') +
          ';margin-bottom:-2px;white-space:nowrap;transition:all 0.2s">' +
          tStageIcon + ' ' + escapeHtml((tItem.topic || '').substring(0, 15)) +
          '<span style="font-size:11px;margin-left:4px;opacity:0.7">' + (tItem.total_insights || 0) + '洞察</span></div>';
      }
      html += '</div>';

      html += '<div id="pipeline-tab-content" style="padding-top:16px"></div>';
    }

    if (failedItems.length > 0) {
      html += '<details style="margin-top:20px"><summary style="cursor:pointer;font-size:13px;color:var(--text-muted);padding:8px 0">' +
        '❌ ' + failedItems.length + ' 个失败任务（点击展开）</summary><div style="margin-top:8px">';
      for (var fi = 0; fi < failedItems.length; fi++) {
        var fa = failedItems[fi];
        var fts = fa.timestamp ? new Date(fa.timestamp * 1000).toLocaleString('zh-CN') : '';
        html += '<div style="padding:8px 12px;margin-bottom:4px;background:#fef2f2;border-radius:6px;font-size:12px;color:#991b1b">' +
          escapeHtml(fa.topic || '未命名') + ' <span style="color:#9ca3af;margin-left:8px">' + fts + '</span></div>';
      }
      html += '</div></details>';
    }

    content.innerHTML = html;

    if (activeItems.length > 0) {
      _loadPipelineTabContent(activeItems[_pipelineActiveTab]);
    }

    if (runningJobs.length > 0) {
      setTimeout(function() { if (currentView === 'analysis') _refreshRunningJobs(); }, 3000);
    }
  } catch(e) {
    content.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败: ' + e.message + '</p></div>';
  }
}

async function _refreshRunningJobs() {
  if (currentView !== 'analysis') return;
  try {
    var jobs = await fetchJSON('/api/jobs');
    var stillRunning = false;
    var container = document.getElementById('running-jobs-area');
    if (!container) { loadAIAnalysis(); return; }

    var runningJobs = [];
    if (jobs && typeof jobs === 'object') {
      for (var jid in jobs) {
        var j = jobs[jid];
        if (j.type === 'analysis' && j.status === 'running') {
          runningJobs.push({ id: jid, topic: j.topic || '分析中...', progress: j.progress || {}, start_time: j.start_time || '', project_id: j.project_id });
          stillRunning = true;
        }
      }
    }

    if (runningJobs.length > 0) {
      var html = '';
      for (var ri = 0; ri < runningJobs.length; ri++) {
        html += _renderRunningJob(runningJobs[ri]);
      }
      container.innerHTML = html;
      setTimeout(function() { if (currentView === 'analysis') _refreshRunningJobs(); }, 3000);
    } else {
      loadAIAnalysis();
    }
  } catch(e) {
    setTimeout(function() { if (currentView === 'analysis') _refreshRunningJobs(); }, 5000);
  }
}

function _switchPipelineTab(idx) {
  _pipelineActiveTab = idx;
  var tabs = document.querySelectorAll('.pipeline-topic-tab');
  for (var i = 0; i < tabs.length; i++) {
    var isAct = parseInt(tabs[i].getAttribute('data-tab-idx')) === idx;
    tabs[i].style.fontWeight = isAct ? '700' : '400';
    tabs[i].style.color = isAct ? 'var(--accent)' : 'var(--text-muted)';
    tabs[i].style.borderBottomColor = isAct ? 'var(--accent)' : 'transparent';
  }
  if (_pipelineData[idx]) {
    _loadPipelineTabContent(_pipelineData[idx]);
  }
}

function _renderRunningJob(rj) {
  var pg = rj.progress;
  var totalModels = pg.total_models || 4;
  var completedModels = pg.completed || 0;
  var pct = Math.round((completedModels / totalModels) * 100);
  var eta = pg.eta_seconds;
  var etaText = eta != null ? (eta <= 0 ? '即将完成' : Math.ceil(eta) + '秒') : '计算中...';
  var phase = pg.phase || 'round1';
  var phaseLabel = phase === 'gathering_sources' ? '📰 收集素材...' : phase === 'inspire' ? '✨ 交叉激发...' : '🔬 模型分析中';
  var sourcesFound = pg.sources_found || 0;
  var models = pg.models || {};

  var h = '<div style="margin-bottom:16px;padding:16px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border-radius:10px;border:1px solid #fde68a">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
    '<div style="font-weight:700;font-size:13px">⏳ ' + escapeHtml((rj.topic || '').split('\n')[0].substring(0, 50)) + '</div>' +
    '<span style="font-size:12px;color:var(--text-muted)">预估: <strong style="color:var(--accent)">' + etaText + '</strong></span></div>' +
    '<div style="display:flex;gap:8px;margin-bottom:8px;font-size:11px">' +
    '<span style="padding:2px 8px;border-radius:10px;background:#dbeafe;color:#2563eb">' + phaseLabel + '</span>' +
    (sourcesFound > 0 ? '<span style="padding:2px 8px;border-radius:10px;background:#dcfce7;color:#16a34a">📰 ' + sourcesFound + ' 条素材</span>' : '') +
    '</div>' +
    '<div style="background:#e5e7eb;border-radius:6px;height:6px;margin-bottom:10px;overflow:hidden">' +
    '<div style="background:linear-gradient(90deg,#3b82f6,#06b6d4);height:100%;border-radius:6px;width:' + pct + '%;transition:width 0.5s"></div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">';
  var mn2 = Object.keys(models);
  for (var i = 0; i < mn2.length; i++) {
    var m = mn2[i], ms = models[m];
    var si2 = ms.status === 'done' ? '✅' : ms.status === 'error' ? '❌' : ms.status === 'calling' ? '🔄' : '⏳';
    h += '<div style="padding:6px;border-radius:6px;background:white;text-align:center;font-size:11px">' + si2 + ' ' + escapeHtml(m) +
      (ms.status === 'done' ? ' <span style="color:#16a34a">' + ms.insights + '</span>' : '') + '</div>';
  }
  h += '</div></div>';
  return h;
}

async function _loadPipelineTabContent(item) {
  var container = document.getElementById('pipeline-tab-content');
  if (!container) return;
  container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">加载详情...</div>';
  try {
    var resp = await fetch('/api/analysis-detail?file=' + encodeURIComponent(item.file));
    var data = await resp.json();
    data._project_id = item.project_id;
    data._stage = item.stage;
    renderAnalysisDetail(container, data);
  } catch (e) {
    container.innerHTML = '<div style="color:red;padding:10px">加载失败: ' + e.message + '</div>';
  }
}

async function loadAnalysisDetail(filepath) {
  var item = null;
  for (var i = 0; i < _pipelineData.length; i++) {
    if (_pipelineData[i].file === filepath) { item = _pipelineData[i]; _pipelineActiveTab = i; break; }
  }
  if (item) {
    loadAIAnalysis();
  } else {
    var container = document.getElementById('pipeline-tab-content') || document.getElementById('analysis-detail-container');
    if (!container) return;
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">加载中...</div>';
    try {
      var resp = await fetch('/api/analysis-detail?file=' + encodeURIComponent(filepath));
      var data = await resp.json();
      renderAnalysisDetail(container, data);
    } catch (e) {
      container.innerHTML = '<div style="color:red;padding:10px">加载失败: ' + e.message + '</div>';
    }
  }
}

var _currentAnalysisData = null;
var _selectedInsights = {};

function renderAnalysisDetail(container, data) {
  _currentAnalysisData = data;
  _selectedInsights = {};
  var stg = data._stage || 'insights';
  var pid = data._project_id;

  var html = '<div class="ai-panel"><div class="ai-panel-body open">';

  // 标题 + 紧凑 meta 行（替代原来的 4 个 stat-card）
  var cLen = (data.consensus_points || []).length;
  var dLen = (data.disagreement_points || []).length;
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap">' +
    '<h3 style="margin:0;flex:1;min-width:200px;font-size:13px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">🔬 ' + escapeHtml((data.topic || '').split('\n')[0].substring(0, 60)) + '</h3>' +
    '<div style="display:flex;gap:14px;font-size:12px;color:var(--text-muted);align-items:center;flex-shrink:0">' +
    '<span>✅ <strong style="color:var(--text)">' + (data.models_succeeded || 0) + '/4</strong> 模型</span>' +
    '<span>💡 <strong style="color:var(--text)">' + (data.total_insights || 0) + '</strong> 洞察</span>';
  if (cLen > 0) html += '<span style="cursor:pointer;color:var(--green)" onclick="document.getElementById(\'section-consensus\').scrollIntoView({behavior:\'smooth\'})">🤝 ' + cLen + ' 共识</span>';
  if (dLen > 0) html += '<span style="cursor:pointer;color:#f59e0b" onclick="document.getElementById(\'section-disagreement\').scrollIntoView({behavior:\'smooth\'})">⚡ ' + dLen + ' 独家</span>';
  html += '</div></div>';

  // 每话题独立的生产线进度条
  html += _renderTopicStageBar(stg);

  // 📰 原始素材来源（evidence_pack）— 始终展示，核心业务信息
  var ep = data.evidence_pack || {};
  var directSrc = ep.direct_sources || [];
  var industrySrc = ep.industry_sources || [];
  var srcCounts = ep.source_counts || {};
  if (directSrc.length > 0 || industrySrc.length > 0) {
    html += '<details open style="margin-bottom:12px"><summary style="cursor:pointer;font-size:12px;font-weight:700;color:var(--text-secondary);padding:4px 0">📰 原始素材来源 <span style="font-weight:400;color:var(--text-muted)">— 直接 ' + (srcCounts.direct || 0) + ' · 行业 ' + (srcCounts.industry || 0) + ' · 热搜 ' + (srcCounts.trending || 0) + ' · 共 ' + (srcCounts.total || 0) + ' 条</span></summary>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:80px;overflow-y:auto">';
    var allSrc = directSrc.concat(industrySrc.slice(0, 15));
    for (var ski = 0; ski < allSrc.length; ski++) {
      var sk = allSrc[ski];
      var skTitle = (sk.title || '').substring(0, 40);
      var skPlatform = sk.platform || '';
      var skUrl = sk.url || sk.link || '';
      var skType = sk.source_type || '';
      var skBg = ski < directSrc.length ? '#fef3c7' : '#f0f9ff';
      var skBorder = ski < directSrc.length ? '#fde68a' : '#bae6fd';
      var skIcon = ski < directSrc.length ? '⭐' : '📄';
      html += '<a href="' + escapeHtml(skUrl) + '" target="_blank" style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;background:' + skBg + ';border:1px solid ' + skBorder + ';border-radius:4px;font-size:10px;color:#374151;text-decoration:none;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis" title="' + escapeHtml(sk.title || '') + '">' + skIcon + ' ' + escapeHtml(skTitle) + ' <span style="color:#9ca3af">·' + escapeHtml(skPlatform) + '</span></a>';
    }
    html += '</div></details>';
  }

  // 浮动选中洞察条 — 用 fixed 定位，始终可见
  html += '<div id="article-action-bar" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:12px 24px;background:linear-gradient(135deg,#3b82f6,#06b6d4);border-radius:12px;color:white;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 8px 32px rgba(59,130,246,0.4);min-width:400px;max-width:700px">' +
    '<span id="selected-count-label" style="font-weight:600;font-size:14px">已选 0 个洞察</span>' +
    '<button style="background:white;color:#3b82f6;border:none;padding:10px 24px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.15)" onclick="startArticleFromSelected()">✍️ 基于选中洞察写文章</button>' +
    '</div>';

  if (data.errors && Object.keys(data.errors).length > 0) {
    html += '<details style="margin-bottom:16px"><summary style="cursor:pointer;font-size:13px;color:#ef4444;font-weight:600">⚠️ ' + Object.keys(data.errors).length + ' 个模型出错</summary>';
    html += '<div style="margin-top:8px;padding:12px;background:#fef2f2;border-radius:6px;font-size:12px">';
    for (var ek in data.errors) {
      html += '<div style="margin-bottom:6px"><strong>' + escapeHtml(ek) + ':</strong> <span style="color:#991b1b">' + escapeHtml(String(data.errors[ek]).substring(0, 200)) + '</span></div>';
    }
    html += '</div></details>';
  }

  var rawResults = data.model_results || {};
  var modelResults = {};
  var modelNames = Object.keys(rawResults);
  for (var nk = 0; nk < modelNames.length; nk++) {
    var nkey = modelNames[nk];
    var nval = rawResults[nkey];
    if (Array.isArray(nval)) {
      modelResults[nkey] = { insights: nval };
    } else if (nval && typeof nval === 'object') {
      modelResults[nkey] = nval;
    } else {
      modelResults[nkey] = { insights: [] };
    }
  }
  modelNames = Object.keys(modelResults);
  var modelColors = { 'GPT-4.1': '#10b981', 'Gemini': '#3b82f6', 'Claude': '#8b5cf6', 'DeepSeek': '#f59e0b', 'Inspire 交叉激发': '#ec4899' };
  var modelAngles = { 'GPT-4.1': '商业分析·资本博弈', 'Gemini': '技术路线·产品演进', 'Claude': '深度思考·反常识', 'DeepSeek': '中国市场·创业者', 'Inspire 交叉激发': '跨模型灵感碰撞' };

  var regularModels = modelNames.filter(function(n) { return n !== 'Inspire 交叉激发'; });
  var hasInspire = modelNames.indexOf('Inspire 交叉激发') >= 0;

  // 4 列平铺：一排显示所有模型
  if (regularModels.length > 0) {
    html += '<div class="model-grid">';
    for (var mi = 0; mi < regularModels.length; mi++) {
      var mn2 = regularModels[mi];
      html += '<div class="model-col">' +
        _renderModelSection(mn2, modelResults[mn2], modelColors[mn2] || '#6b7280', modelAngles[mn2] || '') + '</div>';
    }
    html += '</div>';
  }

  // Inspire 在底部全宽展开
  if (hasInspire) {
    var inspireData = modelResults['Inspire 交叉激发'];
    var inspireInsights = (inspireData || {}).insights || [];
    if (inspireInsights.length > 0) {
      html += '<div style="margin-top:16px;border:2px solid #ec4899;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#fdf2f8,#faf5ff)">';
      html += '<div style="padding:12px 14px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:white">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<div><span style="font-weight:700;font-size:14px">✨ 跨模型交叉激发</span>' +
        '<span style="font-size:11px;padding:1px 8px;border-radius:10px;background:rgba(255,255,255,0.2);margin-left:8px">' + inspireInsights.length + ' 个灵感</span></div>' +
        '<div style="font-size:11px;opacity:0.95">GPT-4.1 阅读 4 模型分析后产出的跨视角洞察</div></div></div>';
      // Inspire 也用 2 列网格
      html += '<div class="inspire-grid">';
      for (var isi = 0; isi < inspireInsights.length; isi++) {
        var sins = inspireInsights[isi];
        var sid = 'inspire_' + isi;
        html += '<div class="inspire-card">' +
          '<div style="display:flex;gap:6px;align-items:flex-start">' +
          '<input type="checkbox" data-insight-id="' + sid + '" onchange="toggleInsightSelect(this)" style="margin-top:3px;cursor:pointer">' +
          '<div style="flex:1;min-width:0">' +
          '<div style="font-size:13px;font-weight:700;margin-bottom:6px;color:#7c3aed;line-height:1.4">' + escapeHtml(sins.title || '') + '</div>';
        if (sins.thesis) html += '<div style="font-size:12px;color:var(--text-secondary);line-height:1.6;margin-bottom:6px">' + escapeHtml(sins.thesis) + '</div>';
        if (sins.spark) html += '<div class="inspire-row" style="border-left-color:#c084fc"><strong style="color:#7c3aed">✨ 灵感:</strong> ' + escapeHtml(sins.spark) + '</div>';
        if (sins.new_reasoning) html += '<div class="inspire-row" style="border-left-color:#86efac"><strong style="color:#166534">🧠 推理:</strong> ' + escapeHtml(sins.new_reasoning) + '</div>';
        if (sins.why_missed) html += '<div class="inspire-row" style="border-left-color:#fb923c"><strong style="color:#c2410c">🔍 盲点:</strong> ' + escapeHtml(sins.why_missed) + '</div>';
        if (sins.value) html += '<div class="inspire-row" style="border-left-color:#34d399"><strong style="color:#065f46">💎 价值:</strong> ' + escapeHtml(sins.value) + '</div>';
        html += '</div></div></div>';
      }
      html += '</div></div>';
    }
  }

  if (data.consensus_points && data.consensus_points.length > 0) {
    html += '<div id="section-consensus" style="margin-bottom:16px;padding:16px;background:#ecfdf5;border-radius:8px;border:1px solid #a7f3d0;scroll-margin-top:20px">' +
      '<h4 style="margin:0 0 10px 0;color:#065f46">🤝 多模型共识 <span style="font-size:12px;font-weight:400;color:#6b7280">— 多个模型给出了相似观点</span></h4>';
    for (var ci = 0; ci < data.consensus_points.length; ci++) {
      var cp = data.consensus_points[ci];
      var cpText = typeof cp === 'string' ? cp : (cp.point || '');
      var cpBy = typeof cp === 'object' && cp.agreed_by ? ' (' + cp.agreed_by.join(', ') + ')' : '';
      html += '<div style="font-size:13px;margin-bottom:6px;line-height:1.7;padding:6px 10px;background:white;border-radius:6px">' +
        '✅ ' + escapeHtml(cpText) + '<span style="font-size:11px;color:#6b7280">' + escapeHtml(cpBy) + '</span></div>';
    }
    html += '</div>';
  }

  if (data.disagreement_points && data.disagreement_points.length > 0) {
    html += '<div id="section-disagreement" style="margin-bottom:16px;padding:16px;background:#fffbeb;border-radius:8px;border:1px solid #fde68a;scroll-margin-top:20px">' +
      '<h4 style="margin:0 0 10px 0;color:#92400e">⚡ 独家观点 <span style="font-size:12px;font-weight:400;color:#6b7280">— 仅一个模型提出的独特视角</span></h4>';
    for (var di = 0; di < data.disagreement_points.length; di++) {
      var dp = data.disagreement_points[di];
      var dpText = typeof dp === 'string' ? dp : (dp.point || '');
      var dpBy = typeof dp === 'object' && dp.only_by ? ' — ' + dp.only_by : '';
      html += '<div style="font-size:13px;margin-bottom:6px;line-height:1.7;padding:6px 10px;background:white;border-radius:6px">' +
        '💡 ' + escapeHtml(dpText) + '<span style="font-size:11px;color:#92400e;font-weight:600">' + escapeHtml(dpBy) + '</span></div>';
    }
    html += '</div>';
  }

  // 工作流操作按钮
  html += '<div style="margin-top:16px;padding:14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0">';
  html += '<div style="font-size:13px;font-weight:700;margin-bottom:10px">📋 工作流操作</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';

  html += '<button class="btn" style="font-size:13px;background:#fef3c7;color:#92400e" onclick="reRunAnalysis(\'' + escapeHtml(data.topic || '') + '\')">🔄 重新分析（获取最新数据+链接）</button>';
  if (stg === 'insights' || stg === 'analysis') {
    html += '<button class="btn btn-primary" onclick="startArticleFromSelected()" style="font-size:13px">✍️ 基于选中洞察写文章</button>';
  }
  if (stg === 'review' || stg === 'writing') {
    html += '<button class="btn" onclick="loadAIAnalysis()" style="font-size:13px">🔄 刷新查看进度</button>';
  }
  if (stg === 'human_review') {
    html += '<button class="btn" style="font-size:13px;background:#dcfce7;color:#166534" onclick="_advanceStage(' + pid + ',\'ready\')">✅ 人审通过</button>';
    html += '<button class="btn" style="font-size:13px;background:#fef3c7;color:#92400e" onclick="_advanceStage(' + pid + ',\'writing\')">🔄 打回重写</button>';
  }
  if (stg === 'ready') {
    html += '<button class="btn btn-primary" style="font-size:13px" onclick="_publishArticle(' + pid + ')">📤 发布到公众号</button>';
    html += '<button class="btn" style="font-size:13px" onclick="_advanceStage(' + pid + ',\'published\')">✅ 仅标记已发布</button>';
    html += '<button class="btn" style="font-size:13px" onclick="copyArticle(_currentAnalysisData._article_file || \'\')">📋 复制全文</button>';
  }
  if (stg === 'published') {
    html += '<span style="font-size:13px;color:#16a34a;font-weight:600">✅ 已发布</span>';
  }
  html += '<button class="btn" style="font-size:12px;color:var(--text-muted)" onclick="_advanceStage(' + pid + ',\'archived\')">📦 归档</button>';
  html += '</div></div>';

  html += '</div></div>';
  container.innerHTML = html;

  // 异步加载当前阶段对应的内容（文章/审核报告/公众号排版等）
  if (pid) {
    _loadStageContentForProject(container, pid, stg);
  }

  // 非 insights 阶段，把模型洞察 + inspire 折叠/隐藏
  if (stg !== 'insights' && stg !== 'analysis') {
    // 收集所有需要折叠的元素：model-grid、inspire区块、共识/独家观点
    var toFold = [];
    var grid = container.querySelector('.model-grid');
    if (grid) toFold.push(grid);
    // inspire 区块（inspire-grid 的父 div）
    var inspG = container.querySelector('.inspire-grid');
    if (inspG) {
      var inspParent = inspG.closest('div[style*="border: 2px solid"], div[style*="border:2px solid"]') || inspG.parentElement;
      if (inspParent && inspParent !== container) toFold.push(inspParent);
    }
    // 共识和独家观点
    var conDiv = container.querySelector('#section-consensus');
    if (conDiv) toFold.push(conDiv);
    var disDiv = container.querySelector('#section-disagreement');
    if (disDiv) toFold.push(disDiv);

    if (toFold.length > 0) {
      var wrap = document.createElement('details');
      wrap.style.marginTop = '16px';
      wrap.innerHTML = '<summary style="cursor:pointer;font-size:13px;color:var(--text-muted);padding:6px 0;font-weight:600">📂 查看选观点阶段的多模型洞察</summary>';
      toFold[0].parentNode.insertBefore(wrap, toFold[0]);
      for (var fi = 0; fi < toFold.length; fi++) wrap.appendChild(toFold[fi]);
    }
  }
}

function _renderTopicStageBar(curStage) {
  var stages = [
    {k:'analysis', icon:'🔬', label:'分析中'},
    {k:'insights', icon:'💡', label:'选观点'},
    {k:'writing', icon:'✍️', label:'写作中'},
    {k:'review', icon:'🤖', label:'机审'},
    {k:'human_review', icon:'👤', label:'人审'},
    {k:'ready', icon:'📤', label:'待发布'},
    {k:'published', icon:'✅', label:'已发布'}
  ];
  var curIdx = -1;
  for (var i = 0; i < stages.length; i++) if (stages[i].k === curStage) { curIdx = i; break; }
  var html = '<div id="topic-stage-bar" style="display:flex;align-items:center;gap:2px;margin-bottom:10px;padding:5px 8px;background:#fafbfc;border:1px solid var(--border);border-radius:8px;overflow-x:auto">';
  for (var j = 0; j < stages.length; j++) {
    var s = stages[j];
    var done = j < curIdx;
    var current = j === curIdx;
    var isNext = j === curIdx + 1;
    var color = current ? 'var(--accent)' : done ? '#10b981' : isNext ? '#f59e0b' : 'var(--text-muted)';
    var bg = current ? '#eff6ff' : isNext ? '#fffbeb' : 'transparent';
    var weight = current ? '700' : isNext ? '600' : '500';
    var border = isNext ? 'border:1px dashed #f59e0b;' : current ? 'border:1px solid var(--accent);' : done ? 'border:1px solid #10b981;' : '';
    // 所有阶段都可点击：已完成/当前 = 查看, 下一步 = 推进, 未来 = 查看(空)
    var cursor = 'cursor:pointer;';
    var title = isNext ? '⚡ 点击推进到' + s.label : done ? '✅ 查看' + s.label + '内容' : current ? '📍 当前: ' + s.label : '查看' + s.label;
    var onclick = ' onclick="_stageAction(\'' + s.k + '\',' + j + ',' + curIdx + ')"';
    html += '<div style="display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;background:' + bg + ';color:' + color + ';font-size:11px;font-weight:' + weight + ';white-space:nowrap;' + cursor + border + '" title="' + title + '"' + onclick + '>' +
      s.icon + ' ' + s.label + '</div>';
    if (j < stages.length - 1) {
      var arrow = j < curIdx ? '#10b981' : '#d1d5db';
      html += '<span style="color:' + arrow + ';font-size:10px">→</span>';
    }
  }
  html += '</div>';
  return html;
}

function _stageAction(stageKey, stageIdx, curIdx) {
  if (!_currentAnalysisData) return;
  var pid = _currentAnalysisData._project_id;

  // 点击下一步：触发对应推进动作
  if (stageIdx === curIdx + 1) {
    if (stageKey === 'writing') {
      if (Object.keys(_selectedInsights).length === 0) {
        alert('请先在「选观点」阶段勾选你认为有价值的洞察，再点写文章。\n\n当前没有选中任何观点。');
        // 切回 insights 阶段让用户选
        _stageAction('insights', 1, curIdx);
        return;
      }
      startArticleFromSelected();
      return;
    }
    if (stageKey === 'review') {
      var af = _currentAnalysisData._article_file;
      if (af) {
        reviewArticle(af);
      } else {
        alert('请先等待文章生成完成');
      }
      return;
    }
    if (stageKey === 'human_review') {
      if (pid) _updateProjectStage(pid, 'human_review');
      return;
    }
    if (stageKey === 'ready') {
      if (pid) _updateProjectStage(pid, 'ready');
      return;
    }
    if (stageKey === 'published') {
      if (pid) {
        if (confirm('确认标记为已发布？')) {
          _updateProjectStage(pid, 'published');
        }
      }
      return;
    }
  }

  // 点击任意阶段（包括当前、已完成、未来）：切换查看该阶段内容
  _currentAnalysisData._stage = stageKey;
  var container = document.getElementById('pipeline-tab-content');
  if (!container) container = document.getElementById('ai-panel-container');
  if (!container) return;

  // 先清除旧的 stage content
  var oldStageContent = document.getElementById('stage-content-section');
  if (oldStageContent) oldStageContent.remove();

  // 重新渲染阶段条（更新高亮）
  var stageBar = document.getElementById('topic-stage-bar');
  if (stageBar && stageBar.parentElement) {
    var newBar = document.createElement('div');
    newBar.innerHTML = _renderTopicStageBar(stageKey);
    stageBar.parentElement.replaceChild(newBar.firstChild, stageBar);
  }

  // 加载该阶段对应的内容
  if (pid) {
    _loadStageContentForProject(container, pid, stageKey);
  }
}

async function _publishArticle(pid) {
  var proj = _currentAnalysisData;
  var title = (proj && proj.topic) || '';
  var articleFile = (proj && proj._article_file) || '';
  if (!confirm('发布文章到微信公众号？\n\n标题: ' + title)) return;
  try {
    var resp = await fetch('/api/publish-article', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ project_id: pid, title: title, article_file: articleFile, platform: 'wechat' })
    });
    var data = await resp.json();
    if (data.success) {
      if (data.article_url) {
        alert('✅ 发布成功！\n\n文章链接: ' + data.article_url);
      } else if (data.wechat_configured === false) {
        alert('📝 已记录发布（微信凭据未配置）\n\n' + (data.hint || '请在 config.yaml 中配置 wechat.app_id 和 app_secret'));
      } else {
        alert('✅ 操作完成');
      }
      loadAIAnalysis();
    } else {
      alert('发布失败: ' + (data.error || ''));
    }
  } catch(e) {
    alert('发布请求失败: ' + e.message);
  }
}

async function _updateProjectStage(pid, newStage) {
  try {
    var resp = await fetch('/api/project/update-stage', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ project_id: pid, stage: newStage })
    });
    var data = await resp.json();
    if (data.success) {
      loadAIAnalysis(); // 刷新整个页面
    } else {
      alert('更新失败: ' + (data.error || ''));
    }
  } catch(e) {
    alert('更新阶段失败: ' + e.message);
  }
}

async function _loadStageContentForProject(container, pid, stage) {
  // 在容器顶部插入 stage 对应的内容（文章预览 / 审核报告等）
  try {
    var resp = await fetch('/api/project?id=' + pid);
    var proj = await resp.json();
    if (!proj || proj.error) return;

    _currentAnalysisData._article_file = proj.article_file || '';
    _currentAnalysisData._review_file = proj.review_file || '';

    var stageHtml = '<div id="stage-content-section" style="margin-bottom:16px">';

    // ===== 各阶段内容展示 =====

    if (stage === 'analysis') {
      stageHtml += '<div style="padding:16px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:10px;border:1px solid #93c5fd">' +
        '<div style="font-size:14px;font-weight:700;color:#1e40af;margin-bottom:6px">🔬 多模型分析阶段</div>' +
        '<div style="font-size:12px;color:#1e3a5f">4个大模型正在并行分析这个话题，分析完成后自动进入「选观点」阶段。</div>' +
        '<div style="margin-top:10px"><button class="btn" style="font-size:12px" onclick="loadAIAnalysis()">🔄 刷新状态</button></div>' +
        '</div>';
    }

    if (stage === 'insights') {
      stageHtml += '<div style="padding:16px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-radius:10px;border:1px solid #6ee7b7">' +
        '<div style="font-size:14px;font-weight:700;color:#065f46;margin-bottom:6px">💡 选观点阶段</div>' +
        '<div style="font-size:12px;color:#064e3b">下方展示了多个模型的分析洞察。<strong>勾选你认为有价值的观点</strong>，然后点击「基于选中洞察写文章」生成深度文章。</div>' +
        '</div>';
    }

    if (stage === 'writing') {
      stageHtml += '<div style="padding:16px;background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:10px;border:1px solid #fbbf24">' +
        '<div style="font-size:14px;font-weight:700;color:#92400e;margin-bottom:6px">✍️ 文章生成中...</div>' +
        '<div style="font-size:12px;color:#78350f">基于选中的洞察，正在调用 AI 模型生成深度文章。通常需要 1-3 分钟。</div>' +
        '<div style="margin-top:10px"><button class="btn" style="font-size:12px" onclick="loadAIAnalysis()">🔄 手动刷新</button></div>' +
        '</div>';
    }

    // ===== 审核阶段（review / human_review）— 双栏布局 =====
    if ((stage === 'review' || stage === 'human_review') && proj.article_file) {
      var _articleContent = '';
      var _articleMeta = {};
      try {
        var _artResp = await fetch('/api/article-detail?file=' + encodeURIComponent(proj.article_file));
        var _artData = await _artResp.json();
        _articleContent = _artData.content || '';
        // 解析 front matter
        if (_articleContent.startsWith('---')) {
          var _fmParts = _articleContent.split('---', 3);
          if (_fmParts.length >= 3) {
            _fmParts[1].split('\n').forEach(function(line) {
              var idx = line.indexOf(':');
              if (idx > 0) _articleMeta[line.substring(0,idx).trim()] = line.substring(idx+1).trim();
            });
            _articleContent = _fmParts[2].trim();
          }
        }
      } catch(ae) { _articleContent = '文章加载失败: ' + ae.message; }

      // 加载审核数据
      var _revJson = null, _score = 0, _verdict = 'unknown', _verdictLabel = '未知', _verdictColor = '#6b7280';
      var _sugs = [], _factuals = [];
      if (proj.review_file) {
        try {
          var _rvResp = await fetch('/api/article-detail?file=' + encodeURIComponent(proj.review_file));
          var _rvData = await _rvResp.json();
          _revJson = JSON.parse(_rvData.content || '{}');
          _score = proj.review_score || _revJson.overall_score || 0;
          _verdict = proj.review_verdict || _revJson.verdict || 'unknown';
          _verdictColor = (_verdict === 'publish' || _verdict === 'approve') ? '#10b981' : (_verdict === 'revise') ? '#f59e0b' : (_verdict === 'reject') ? '#ef4444' : '#6b7280';
          _verdictLabel = _verdict === 'publish' ? '✅ 可发布' : _verdict === 'revise' ? '⚠️ 建议修订' : _verdict === 'reject' ? '❌ 不建议发布' : _verdict;
          _sugs = _revJson.revision_suggestions || _revJson.suggestions || [];
          if (!Array.isArray(_sugs)) _sugs = [];
          _factuals = _revJson.factual_issues || [];
          if (!Array.isArray(_factuals)) _factuals = [];
        } catch(re) {}
      }

      // 双栏：左文章(可编辑) + 右侧栏(元数据+审核+操作)
      stageHtml += '<div style="display:flex;gap:16px;margin-top:12px;align-items:flex-start">';

      // === 左栏：文章编辑区 ===
      stageHtml += '<div style="flex:1;min-width:0">';
      stageHtml += '<div style="border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;background:white">';
      stageHtml += '<div style="padding:8px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center">';
      stageHtml += '<span style="font-size:12px;color:var(--text-muted)">📝 文章内容（可直接编辑）</span>';
      stageHtml += '<div style="display:flex;gap:6px">';
      stageHtml += '<button class="btn" style="font-size:11px" onclick="copyArticle(\'' + escapeJs(proj.article_file) + '\')">📋 复制</button>';
      stageHtml += '<a href="/api/article-detail?file=' + encodeURIComponent(proj.article_file) + '" target="_blank" class="btn" style="font-size:11px;text-decoration:none">↗ 新窗口</a>';
      stageHtml += '</div></div>';
      // 可编辑的文章区域 — 全文、无截断
      stageHtml += '<div id="article-editor" contenteditable="true" style="padding:20px 24px;font-size:14px;line-height:2;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;outline:none;min-height:400px;max-height:calc(100vh - 260px);overflow-y:auto;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif">';
      stageHtml += escapeHtml(_articleContent);
      stageHtml += '</div></div></div>';

      // === 右栏：元数据 + 审核结果 + 操作 ===
      stageHtml += '<div style="width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto">';

      // 1) 基础信息
      stageHtml += '<div style="border:1px solid #e2e8f0;border-radius:10px;background:white;padding:14px">';
      stageHtml += '<div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:8px">📋 基础信息</div>';
      stageHtml += '<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px">';
      stageHtml += '<span style="color:var(--text-muted)">标题</span><span style="font-weight:600">' + escapeHtml(proj.article_title || _articleMeta.title || '未命名') + '</span>';
      stageHtml += '<span style="color:var(--text-muted)">模型</span><span>' + escapeHtml(_articleMeta.model || '未知') + '</span>';
      stageHtml += '<span style="color:var(--text-muted)">字数</span><span>' + (_articleMeta.word_count || _articleContent.length) + ' 字</span>';
      stageHtml += '<span style="color:var(--text-muted)">生成耗时</span><span>' + (_articleMeta.generation_time || '未知') + '</span>';
      stageHtml += '<span style="color:var(--text-muted)">阶段</span><span>' + (stage === 'review' ? '🤖 机审' : '👤 人审') + '</span>';
      stageHtml += '</div></div>';

      // 2) 机审结果
      if (proj.review_file && _revJson) {
        stageHtml += '<div style="border:1px solid ' + _verdictColor + '44;border-radius:10px;background:white;padding:14px">';
        stageHtml += '<div style="font-size:12px;font-weight:700;margin-bottom:8px">🤖 审核结果</div>';
        // 总分 + 判定
        stageHtml += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">';
        stageHtml += '<div style="font-size:28px;font-weight:800;color:' + _verdictColor + '">' + _score + '<span style="font-size:14px;font-weight:400">/10</span></div>';
        stageHtml += '<div style="padding:4px 12px;border-radius:8px;background:' + _verdictColor + '15;color:' + _verdictColor + ';font-weight:700;font-size:13px">' + _verdictLabel + '</div>';
        stageHtml += '</div>';
        // 4 维分数
        var _dims = [
          {k:'style_score',l:'文风',i:'🎨'}, {k:'depth_score',l:'深度',i:'🔬'},
          {k:'breadth_score',l:'广度',i:'🌐'}, {k:'readability_score',l:'可读性',i:'📖'}
        ];
        stageHtml += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">';
        for (var di = 0; di < _dims.length; di++) {
          var dv = _revJson[_dims[di].k] || 0;
          var dvColor = dv >= 8 ? '#10b981' : dv >= 6 ? '#f59e0b' : '#ef4444';
          stageHtml += '<div style="display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f8fafc;border-radius:6px">';
          stageHtml += '<span style="font-size:11px">' + _dims[di].i + ' ' + _dims[di].l + '</span>';

      stageHtml += '</div>';

      stageHtml += '</div>'; // 右栏结束
      stageHtml += '</div>'; // flex 双栏结束

    // ===== 非审核阶段的文章展示（writing/ready/published）=====

          '<div style="font-size:13px;font-weight:700;color:#1e40af">📄 ' + escapeHtml(proj.article_title || '未命名文章') + '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button class="btn" style="font-size:11px" onclick="copyArticle(\'' + escapeJs(proj.article_file) + '\')">📋 复制全文</button>' +

        if (!proj.review_file && (stage === 'writing')) {

        }
        stageHtml += '</div></div>' +
          '<div style="padding:20px 24px;font-size:14px;line-height:2;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word">' +

    // 待发布：公众号排版预览 + 一键复制（非审核阶段）

    // 把 stage 内容插入到 stage-bar 之后

function reRunAnalysis(topic) {
  if (!topic) { alert('话题为空'); return; }
  if (!confirm('将对「' + topic + '」重新发起 4 模型并行分析。\n新版分析将包含可点击的原文链接。\n\n确认？')) return;
  fetch('/api/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ topic: topic }),
  }).then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.job_id) {
      alert('✅ 分析已启动！\n任务ID: ' + d.job_id + '\n\n分析完成后页面会自动刷新。');
      switchView('analysis');
    } else {
      alert('启动失败: ' + (d.error || JSON.stringify(d)));
    }
  }).catch(function(e) { alert('请求失败: ' + e.message); });
}

function _advanceStage(projectId, newStage) {
  if (!projectId) { alert('此任务未关联项目'); return; }
  fetch('/api/project/update-stage', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ project_id: projectId, stage: newStage }),
  }).then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) { loadAIAnalysis(); }
    else { alert('更新失败: ' + (d.error || '')); }
  }).catch(function(e) { alert('请求失败: ' + e.message); });
}

function _renderModelSection(mname, mdata, mcolor, angleLabel) {
  var insights = (mdata || {}).insights || [];
  var html = '<div class="model-card model-card-compact" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;border-top:3px solid ' + mcolor + ';height:100%;display:flex;flex-direction:column">';
  html += '<div style="padding:5px 8px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:4px">' +
    '<div style="min-width:0;flex:1">' +
    '<div style="font-weight:700;font-size:12px;color:' + mcolor + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🤖 ' + escapeHtml(mname) + '</div>' +
    '</div>' +
    '<span style="font-size:11px;padding:1px 8px;border-radius:10px;background:' + mcolor + '22;color:' + mcolor + ';font-weight:600;flex-shrink:0">' + insights.length + '</span></div>';

  html += '<div style="flex:1;overflow-y:auto;max-height:none">';
  for (var ii = 0; ii < insights.length; ii++) {
    var ins = insights[ii];
    var iid = mname + '_' + ii;
    if (ins._parse_error) {
      var partialText = ins.core_insight || ins.title || '(数据不完整)';
      html += '<div class="insight-row" style="background:#fffbeb">' +
        '<div style="font-size:11px;color:#92400e;font-weight:600;margin-bottom:4px">⚠️ 解析不完整</div>' +
        '<details><summary style="cursor:pointer;font-size:11px;color:#6b7280">查看片段</summary>' +
        '<pre style="font-size:10px;background:#f8fafc;padding:6px;border-radius:4px;overflow-x:auto;white-space:pre-wrap;margin-top:4px;max-height:200px;overflow-y:auto">' + escapeHtml(partialText) + '</pre></details></div>';
      continue;
    }
    var conf = ins.confidence || 0;
    var confColor = conf >= 0.85 ? '#10b981' : conf >= 0.7 ? '#3b82f6' : conf >= 0.5 ? '#f59e0b' : '#6b7280';
    var origColor = ins.originality === 'high' ? '#ef4444' : ins.originality === 'medium' ? '#f59e0b' : '#9ca3af';
    var origLabel = ins.originality === 'high' ? '🔥 独家' : ins.originality === 'medium' ? '💡 新颖' : '📰 常见';
    html += '<div class="insight-row">' +
      '<div style="display:flex;gap:4px;align-items:flex-start">' +
      '<input type="checkbox" data-insight-id="' + iid + '" onchange="toggleInsightSelect(this)" style="margin-top:2px;cursor:pointer;flex-shrink:0;width:13px;height:13px">' +
      '<span style="min-width:16px;height:16px;text-align:center;line-height:16px;font-size:9px;font-weight:700;color:white;background:' + mcolor + ';border-radius:50%;flex-shrink:0">' + (ii+1) + '</span>' +
      '<div style="flex:1;min-width:0">' +
      '<div class="insight-meta">';
    if (ins.angle) html += '<span style="background:' + mcolor + '15;color:' + mcolor + ';font-weight:600">' + escapeHtml(ins.angle) + '</span>';
    html += '<span style="color:' + origColor + ';font-weight:600">' + origLabel + '</span>' +
      '<span style="color:' + confColor + '">' + (conf * 100).toFixed(0) + '%</span></div>' +
      '<div class="insight-title">' + escapeHtml(ins.title || ins.core_insight || '') + '</div>';
    if (ins.thesis) html += '<div class="insight-thesis">' + escapeHtml(ins.thesis) + '</div>';

    // 📰 原始文章来源（始终显示，不折叠）— 核心业务信息
    var evList = ins.evidence;
    var sourcesShown = {};
    if (evList && Array.isArray(evList) && evList.length > 0) {
      var srcHtml = '';
      for (var si = 0; si < evList.length; si++) {
        var sev = evList[si];
        if (typeof sev === 'object' && sev.source && !sourcesShown[sev.source]) {
          sourcesShown[sev.source] = true;
          var credIcon2 = sev.credibility === 'verified' || sev.credibility === 'high' ? '🟢' : sev.credibility === 'public' || sev.credibility === 'medium' ? '🟡' : '🔴';
          var hasUrl2 = sev.source_url && sev.source_url.length > 5;
          srcHtml += '<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 6px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:4px;font-size:10px;color:#0369a1;white-space:nowrap">' + credIcon2 + ' ';
          if (hasUrl2) srcHtml += '<a href="' + escapeHtml(sev.source_url) + '" target="_blank" style="color:#0369a1;text-decoration:none">' + escapeHtml(sev.source) + ' ↗</a>';
          else srcHtml += escapeHtml(sev.source);
          srcHtml += '</span> ';
        }
      }
      if (srcHtml) html += '<div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;align-items:center"><span style="font-size:9px;color:var(--text-muted);font-weight:600">📰 来源:</span>' + srcHtml + '</div>';
    }

    // 推理/证据详情/反驳/建议 折叠
    var hasDetails = ins.reasoning || ins.counter_argument || (ins.implication || ins.implications) || (evList && (Array.isArray(evList) ? evList.length > 0 : evList));
    if (hasDetails) {
      var detailParts = [];
      if (ins.reasoning) detailParts.push('推理');
      if (evList) detailParts.push('证据详情');
      if (ins.counter_argument) detailParts.push('反驳');
      if (ins.implication || ins.implications) detailParts.push('建议');
      html += '<details style="margin-top:2px"><summary style="cursor:pointer;font-size:9px;color:var(--text-muted);font-weight:600;padding:1px 0">' + detailParts.join(' · ') + '</summary>';
      if (ins.reasoning) html += '<div class="insight-block" style="background:#f0fdf4;border-left-color:#86efac">' +
        '<strong style="color:#166534">🧠</strong> ' + escapeHtml(ins.reasoning) + '</div>';
      if (evList && Array.isArray(evList) && evList.length > 0) {
        for (var ei = 0; ei < evList.length; ei++) {
          var ev = evList[ei];
          if (typeof ev === 'string') {
            html += '<div class="ev-item">• ' + escapeHtml(ev) + '</div>';
          } else {
            var credIcon = ev.credibility === 'verified' || ev.credibility === 'high' ? '🟢' : ev.credibility === 'public' || ev.credibility === 'medium' ? '🟡' : '🔴';
            var hasUrl = ev.source_url && ev.source_url.length > 5;
            html += '<div class="ev-item">' + credIcon + ' ' + escapeHtml(ev.fact || '');
            if (ev.source && hasUrl) html += ' <a href="' + escapeHtml(ev.source_url) + '" target="_blank" style="color:#3b82f6;font-size:9px">' + escapeHtml(ev.source) + ' ↗</a>';
            html += '</div>';
          }
        }
      } else if (typeof evList === 'string' && evList) {
        html += '<div class="ev-item">🟡 ' + escapeHtml(evList) + '</div>';
      }
      if (ins.counter_argument) html += '<div class="insight-block" style="background:#fef3c7;border-left-color:#fbbf24">' +
        '<strong style="color:#92400e">⚡</strong> ' + escapeHtml(ins.counter_argument) + '</div>';
      var actionText = ins.implication || ins.implications || '';
      if (actionText) html += '<div class="insight-block" style="background:#eff6ff;border-left-color:#93c5fd">' +
        '<strong style="color:#1e40af">🎯</strong> ' + escapeHtml(actionText) + '</div>';
      html += '</details>';
    }
    html += '</div></div></div>';
  }
  html += '</div></div>';
  return html;
}

function _switchModelTab(el, modelIdx) {
  var panels = document.querySelectorAll('.model-panel');
  var tabs = document.querySelectorAll('.model-tab');
  for (var i = 0; i < panels.length; i++) panels[i].style.display = 'none';
  for (var j = 0; j < tabs.length; j++) {
    tabs[j].style.color = 'var(--text-muted)';
    tabs[j].style.borderBottomColor = 'transparent';
  }
  var target = document.querySelector('.model-panel[data-model-panel="' + modelIdx + '"]');
  if (target) target.style.display = '';
  el.style.borderBottomColor = el.style.color;
  var modelColors2 = { 0: '#10b981', 1: '#3b82f6', 2: '#8b5cf6', 3: '#f59e0b', 'inspire': '#ec4899' };
  el.style.color = modelColors2[modelIdx] || 'var(--accent)';
  el.style.borderBottomColor = el.style.color;
}

function toggleInsightSelect(checkbox) {
  var id = checkbox.getAttribute('data-insight-id');
  if (checkbox.checked) {
    _selectedInsights[id] = true;
  } else {
    delete _selectedInsights[id];
  }
  var count = Object.keys(_selectedInsights).length;
  var bar = document.getElementById('article-action-bar');
  var label = document.getElementById('selected-count-label');
  if (bar) bar.style.display = count > 0 ? 'flex' : 'none';
  if (label) label.textContent = '已选 ' + count + ' 个洞察';
}

function autoSelectBestInsights() {
  // 自动选中 high/medium 原创性的洞察
  if (!_currentAnalysisData) return;
  var modelResults = _currentAnalysisData.model_results || {};
  var count = 0;
  for (var modelName in modelResults) {
    if (modelName === 'Inspire 交叉激发') continue;
    var insights = (modelResults[modelName] || {}).insights || [];
    for (var i = 0; i < insights.length; i++) {
      var ins = insights[i];
      if (ins.originality === 'high' || ins.originality === 'medium') {
        var key = modelName + '_' + i;
        _selectedInsights[key] = true;
        count++;
        // 更新 checkbox 状态（如果可见）
        var cb = document.getElementById('cb_' + key);
        if (cb) cb.checked = true;
      }
    }
  }
  // 同时选中 Inspire 交叉激发的洞察
  var inspireInsights = (modelResults['Inspire 交叉激发'] || {}).insights || [];
  for (var j = 0; j < inspireInsights.length; j++) {
    var ikey = 'inspire_' + j;
    _selectedInsights[ikey] = true;
    count++;
    var icb = document.getElementById('cb_' + ikey);
    if (icb) icb.checked = true;
  }
  if (count === 0) {
    // 如果没有 high/medium，选中所有
    for (var mn in modelResults) {
      var inss = (modelResults[mn] || {}).insights || [];
      for (var k = 0; k < inss.length; k++) {
        var akey = (mn === 'Inspire 交叉激发' ? 'inspire' : mn) + '_' + k;
        _selectedInsights[akey] = true;
        count++;
      }
    }
  }
}

function startArticleFromSelected() {
  if (!_currentAnalysisData) return;
  var ids = Object.keys(_selectedInsights);
  if (ids.length === 0) { alert('请先勾选你认为有价值的洞察'); return; }

  var selectedInsights = [];
  var modelResults = _currentAnalysisData.model_results || {};
  for (var i = 0; i < ids.length; i++) {
    var parts = ids[i].split('_');
    var modelName = parts.slice(0, -1).join('_');
    var idx = parseInt(parts[parts.length - 1]);
    if (modelName === 'inspire') {
      var inspireIns = ((modelResults['Inspire 交叉激发'] || {}).insights || [])[idx];
      if (inspireIns) selectedInsights.push(Object.assign({}, inspireIns, {_from: 'Inspire'}));
    } else {
      var mIns = ((modelResults[modelName] || {}).insights || [])[idx];
      if (mIns) selectedInsights.push(Object.assign({}, mIns, {_from: modelName}));
    }
  }

  var topic = _currentAnalysisData.topic;
  var briefing = '话题: ' + topic + '\n\n你选择了 ' + selectedInsights.length + ' 个洞察:\n\n';
  var showCount = Math.min(selectedInsights.length, 6);
  for (var j = 0; j < showCount; j++) {
    var s = selectedInsights[j];
    briefing += (j+1) + '. [' + (s._from || '') + '] ' + (s.title || s.core_insight || '').substring(0, 50) + '\n';
  }
  if (selectedInsights.length > showCount) {
    briefing += '... 等共 ' + selectedInsights.length + ' 条\n';
  }
  briefing += '\n确认要基于这些洞察生成深度文章吗？';
  if (!confirm(briefing)) return;

  var payload = { topic: topic, selected_insights: selectedInsights, project_id: _currentAnalysisData._project_id || null };
  fetch('/api/generate-article', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  }).then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.job_id) {
      // 更新当前阶段显示为 writing，并开始轮询
      if (_currentAnalysisData && _currentAnalysisData._project_id) {
        _currentAnalysisData._stage = 'writing';
      }
      // 轮询等待文章生成完成
      pollJob(data.job_id);
      // 刷新页面显示 writing 状态
      if (currentView === 'analysis') loadAIAnalysis();
    } else {
      alert('启动失败: ' + (data.error || '未知错误'));
    }
  }).catch(function(e) { alert('请求失败: ' + e.message); });
}

function togglePanel(el) {

function getItems() {
  var items = [];
  if (currentView === 'ai') {
    items = aiFiltered.map(function(n) {
      var backendTag = n.ai_tags && n.ai_tags[0];
      var mappedTag = mapBackendTag(backendTag) || classifyTitle(n.title);
      return Object.assign({}, n, {
        type: 'news', source: n.platform_name,
        tag: mappedTag,
        time: n.last_crawl_time
      });
    });
  } else if (currentView === 'picks') {
    return [];
  } else if (currentView === 'analysis') {
    return [];
  } else {
    if (currentView === 'all' || currentView === 'hot') {
      items = items.concat(allNews.map(function(n) {
        return Object.assign({}, n, {
          type: 'news', source: n.platform_name,
          tag: classifyTitle(n.title), time: n.last_crawl_time
        });
      }));
    }
    if (currentView === 'all' || currentView === 'rss') {
      items = items.concat(allRss.map(function(r) {
        return Object.assign({}, r, {
          type: 'rss', source: r.feed_name,
          tag: classifyTitle(r.title), time: r.published_at || r.first_crawl_time
        });
      }));
    }
    if (currentView.startsWith('source:')) {
      var sname = currentView.replace('source:', '');
      items = allNews.filter(function(n) { return n.platform_name === sname; }).map(function(n) {
        return Object.assign({}, n, { type: 'news', source: n.platform_name, tag: classifyTitle(n.title), time: n.last_crawl_time });
      });
    }
    if (currentView.startsWith('feed:')) {
      var fname = currentView.replace('feed:', '');
      items = allRss.filter(function(r) { return r.feed_name === fname; }).map(function(r) {
        return Object.assign({}, r, { type: 'rss', source: r.feed_name, tag: classifyTitle(r.title), time: r.published_at || r.first_crawl_time });
      });
    }
  }
  if (currentTag) {
    items = items.filter(function(i) { return i.tag === currentTag; });
  }
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    items = items.filter(function(i) { return i.title.toLowerCase().includes(q); });
  }
  return items;
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escapeJs(s) {
  return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
}

        var icon = stageIcons2[stage] || '📄';
        var label = stageLabels3[stage] || stage;

          '<div style="display:flex;gap:12px;font-size:12px;color:var(--text-muted)">' +
          '<span>📰 ' + (ev.total_articles || 0) + ' 篇</span>' +
          '<span>📅 ' + days + ' 天</span>' +
          '<span>' + (ev.start_date || '') + '</span></div></div>';
      });
      html += '</div>';
    }

    // 选题命中率分析
    if (Array.isArray(topicHits) && topicHits.length > 0) {
      var hitCount = topicHits.filter(function(h) { return h.verdict !== '没抓住' && h.verdict !== '未覆盖'; }).length;
      var totalEvents = topicHits.length;
      var hitRate = totalEvents > 0 ? Math.round((hitCount / totalEvents) * 100) : 0;
      var verdictColors = {'爆了':'#ef4444','抓住了':'#10b981','在写':'#3b82f6','有分析':'#f59e0b','没抓住':'#9ca3af','未覆盖':'#d1d5db'};

      html += '<div class="section-bar" style="margin-top:24px"><h3>🎯 选题命中率</h3>' +
        '<span style="font-size:12px;color:var(--text-muted)">覆盖 ' + hitCount + '/' + totalEvents + ' 个热点 · 命中率 <strong style="color:' + (hitRate >= 60 ? '#10b981' : hitRate >= 30 ? '#f59e0b' : '#ef4444') + '">' + hitRate + '%</strong></span></div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">';
      topicHits.forEach(function(h) {
        var color = verdictColors[h.verdict] || '#6b7280';
        html += '<div style="padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;background:white;min-width:200px;flex:1;max-width:300px">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
          '<span style="font-size:13px;font-weight:600">' + escapeHtml(h.event_name || '未知事件') + '</span>' +
          '<span style="font-size:10px;padding:1px 8px;border-radius:10px;background:' + color + '22;color:' + color + ';font-weight:700">' + escapeHtml(h.verdict) + '</span></div>' +
          '<div style="font-size:11px;color:var(--text-muted)">全网 ' + (h.total_event_views || 0) + ' 篇 · ' + (h.lifecycle_stage || '') + '</div></div>';
      });
      html += '</div>';
    }

    // 全网热度排行
    html += '<div class="section-bar" style="margin-top:24px"><h3>📊 实时热度排行</h3>' +
      '<span style="font-size:12px;color:var(--text-muted)">基于多平台排名综合计算</span></div>';
    html += '<div id="heat-ranking">加载中...</div>';

    html += '<div id="data-form-area"></div>';
    content.innerHTML = html;
    // Async load heat ranking
    loadHeatRanking();
  } catch(e) {
    content.innerHTML = '<div class="empty-state"><div class="icon">&#128200;</div><p>加载失败: ' + escapeHtml(e.message) + '</p></div>';
  }
}

async function loadHeatRanking() {
  var el = document.getElementById('heat-ranking');
  if (!el) return;
  try {
    var data = await fetchJSON('/api/engagement');
    if (!Array.isArray(data) || data.length === 0) {
      el.innerHTML = '<div style="font-size:13px;color:var(--text-muted);padding:12px">暂无热度数据</div>';
      return;
    }
    // Sort by views (heat score) descending, take top 15
    data.sort(function(a, b) { return (b.views || 0) - (a.views || 0); });
    var top = data.slice(0, 15);
    var maxHeat = top[0].views || 1;
    var hHtml = '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:20px">';
    top.forEach(function(item, idx) {
      var pct = Math.round((item.views / maxHeat) * 100);
      var rankColor = idx < 3 ? '#ef4444' : idx < 7 ? '#f59e0b' : '#6b7280';
      hHtml += '<div style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:6px;background:white;border:1px solid #f1f5f9">' +
        '<span style="font-weight:700;color:' + rankColor + ';min-width:20px;text-align:center">' + (idx + 1) + '</span>' +
        '<div style="flex:1;overflow:hidden">' +
        '<div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(item.title || '—') + '</div>' +
        '<div style="height:4px;background:#f1f5f9;border-radius:2px;margin-top:3px"><div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,' + rankColor + ',' + rankColor + '66);border-radius:2px"></div></div>' +
        '</div>' +

function switchWorkstation() {
  var ws = ['wechat', 'video', 'all'];

function updateNavVisibility() {
  var navItems = document.querySelectorAll('.nav-item[data-view]');
  var wechatViews = ['overview','all','ai','hot','rss','picks','analysis','data','competitors','comments','console'];
  var videoViews = ['overview','all','ai','hot','rss','picks','video','console'];
  var allViews = null;
  navItems.forEach(function(el) {
    var view = el.getAttribute('data-view');
    if (currentWorkstation === 'all' || allViews === null && currentWorkstation === 'all') {
      el.style.display = '';
    } else if (currentWorkstation === 'wechat') {
      el.style.display = wechatViews.includes(view) ? '' : 'none';
    } else if (currentWorkstation === 'video') {
      el.style.display = videoViews.includes(view) ? '' : 'none';

  });

async function loadSystemHealth() {

    var el = document.getElementById('health-content');
    if (!el) return;

    var llmHtml = '';
    var llmIcon = function(status) {
      if (status === 'configured') return '<span style="color:#10b981">✅ 已配置</span>';
      if (status === 'in_config') return '<span style="color:#f59e0b">⚠️ 仅在config.yaml</span>';
      return '<span style="color:#ef4444">❌ 未配置</span>';
    };
    llmHtml += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">' +
      '<div style="padding:8px 12px;border-radius:6px;background:' + (h.llm.airouter === 'configured' ? '#ecfdf5' : '#fef2f2') + '"><span style="font-size:11px;color:var(--text-muted)">🔑 AIRouter (核心)</span><br>' + llmIcon(h.llm.airouter) + '</div>' +
      '<div style="padding:8px 12px;border-radius:6px;background:#f8fafc"><span style="font-size:11px;color:var(--text-muted)">Anthropic API</span><br>' + llmIcon(h.llm.anthropic) + '</div>' +
      '<div style="padding:8px 12px;border-radius:6px;background:#f8fafc"><span style="font-size:11px;color:var(--text-muted)">OpenAI API</span><br>' + llmIcon(h.llm.openai) + '</div>' +
      '</div>';

    // Scan status
    var scanTime = h.scan.last_time ? new Date(h.scan.last_time * 1000).toLocaleTimeString() : '从未';
    var scanOk = h.scan.last_result === 'success';
    var evalLabel = h.scan.eval_method === 'rule_fallback' ? '📏 规则评分(fallback)' :
                    h.scan.eval_method === 'llm' ? '🧠 LLM评估' : '⏳ 未运行';
    var scanHtml = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">' +
      '<div style="padding:8px 12px;border-radius:6px;background:#f8fafc"><span style="font-size:11px;color:var(--text-muted)">上次扫描</span><br>' +
        (scanOk ? '✅' : '⚠️') + ' ' + scanTime + '</div>' +
      '<div style="padding:8px 12px;border-radius:6px;background:#f8fafc"><span style="font-size:11px;color:var(--text-muted)">评分方式</span><br>' + evalLabel + '</div>' +
      '<div style="padding:8px 12px;border-radius:6px;background:#f8fafc"><span style="font-size:11px;color:var(--text-muted)">发现话题</span><br>' + h.scan.topics_found + ' 个</div>' +
      '</div>';

    // Server info
    var uptimeH = Math.floor(h.server.uptime_seconds / 3600);
    var uptimeM = Math.floor((h.server.uptime_seconds % 3600) / 60);
    var serverHtml = '<div style="display:flex;gap:16px;font-size:12px;color:var(--text-muted)">' +
      '<span>⏱ 运行 ' + uptimeH + 'h' + uptimeM + 'm</span>' +
      '<span>📡 PID ' + h.server.pid + '</span>' +
      '<span>💾 磁盘余 ' + h.server.disk_free_gb + 'GB</span>' +
      '<span>🤖 自动确认 ' + h.scan.auto_confirmed_total + ' 篇</span>' +
      (h.feishu_configured ? '<span>📨 飞书 ✓</span>' : '') +
      '</div>';

    // Show config form if keys missing
    var configHtml = '';
    if (h.llm.airouter === 'missing' || h.llm.anthropic === 'missing' || h.llm.openai === 'missing') {
      var isCore = h.llm.airouter === 'missing';
      configHtml = '<div style="margin-top:12px;padding:12px;border:1px solid ' + (isCore ? '#ef4444' : '#fbbf24') + ';border-radius:8px;background:' + (isCore ? '#fef2f2' : '#fffbeb') + '">' +

        '<div style="display:grid;gap:8px">' +
        (h.llm.airouter === 'missing' ? '<input id="cfg-airouter" type="password" placeholder="AIRouter API Key（核心，用于多模型分析+选题评估）" style="padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px">' : '') +

    el.innerHTML = llmHtml + scanHtml + serverHtml + configHtml;
  } catch(e) {
    var el = document.getElementById('health-content');
    if (el) el.innerHTML = '<span style="color:#ef4444">加载失败: ' + e.message + '</span>';
  }

async function saveApiKeys() {
  var airouterEl = document.getElementById('cfg-airouter');
  var airouterBaseEl = document.getElementById('cfg-airouter-base');
  var anthropicEl = document.getElementById('cfg-anthropic');
  var openaiEl = document.getElementById('cfg-openai');
  var body = {};
  if (airouterEl && airouterEl.value.trim()) body.airouter_key = airouterEl.value.trim();
  if (airouterBaseEl && airouterBaseEl.value.trim()) body.airouter_base = airouterBaseEl.value.trim();
  if (anthropicEl && anthropicEl.value.trim()) body.anthropic_key = anthropicEl.value.trim();
  if (openaiEl && openaiEl.value.trim()) body.openai_key = openaiEl.value.trim();
  if (!body.airouter_key && !body.anthropic_key && !body.openai_key) { alert('请输入至少一个 API Key'); return; }
  try {
    var resp = await fetch('/api/save-api-keys', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    var data = await resp.json();
    if (data.success) {
      alert('✅ ' + data.message);
      loadSystemHealth();
    } else {
      alert('❌ ' + (data.error || '保存失败'));
    }
  } catch(e) { alert('保存出错: ' + e.message); }
}

async function generateVideoScript() {
  var topic = document.getElementById('v-topic').value.trim();
  if (!topic) { alert('请输入话题'); return; }
  var ctx = document.getElementById('v-context').value.trim();
  var platform = document.getElementById('v-platform').value;
  var duration = parseInt(document.getElementById('v-duration').value) || 60;

  document.getElementById('video-result').innerHTML =
    '<div class="ai-panel"><div class="ai-panel-body open"><div style="text-align:center;padding:20px;color:var(--text-muted)">⏳ 正在生成视频脚本...</div></div></div>';

  try {
    var resp = await fetch('/api/video/generate-script', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ topic: topic, context: ctx, platform: platform, duration: duration }),
    });
    var data = await resp.json();
    if (data.job_id) {
      await pollVideoJob(data.job_id);
    }
  } catch (e) {
    document.getElementById('video-result').innerHTML = '<div style="color:red;padding:10px">生成失败: ' + e.message + '</div>';
  }
}

async function generateScriptFromArticle() {
  var title = document.getElementById('va-title').value.trim();
  var content = document.getElementById('va-content').value.trim();
  if (!content) { alert('请输入文章内容'); return; }

  document.getElementById('video-result').innerHTML =

  try {

    });
    var data = await resp.json();
    if (data.job_id) {
      await pollVideoJob(data.job_id);
    }
  } catch (e) {
    document.getElementById('video-result').innerHTML = '<div style="color:red;padding:10px">生成失败: ' + e.message + '</div>';
  }

async function pollVideoJob(jobId) {
  for (var i = 0; i < 120; i++) {
    await new Promise(function(r) { setTimeout(r, 2000); });
    try {
      var job = await fetchJSON('/api/job?id=' + jobId);
      if (job.status === 'done') {
        renderVideoResult(job.result);
        return;
      }
      if (job.status === 'error') {
        document.getElementById('video-result').innerHTML = '<div style="color:red;padding:10px">出错: ' + (job.error || '') + '</div>';
        return;
      }
    } catch (e) { }
  }
}

async function manualScanTopics() {
  var btn = document.getElementById('scan-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 扫描中...'; }
  try {
    var resp = await fetch('/api/scan-topics', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({}),
    });
    var text = await resp.text();
    var data;
    try { data = JSON.parse(text); } catch (_) {
      alert('扫描请求返回异常: ' + text.substring(0, 200));
      if (btn) { btn.disabled = false; btn.textContent = '🔄 立即扫描'; }
      return;
    }
    if (data.job_id) {
      await pollScanJob(data.job_id);
    } else if (data.error) {
      alert('扫描失败: ' + data.error);
    }
  } catch (e) {
    alert('扫描失败: ' + e.message);
  }
  if (btn) { btn.disabled = false; btn.textContent = '🔄 立即扫描'; }
}

async function pollScanJob(jobId) {
  var btn = document.getElementById('scan-btn');
  for (var i = 0; i < 60; i++) {
    await new Promise(function(r) { setTimeout(r, 2000); });
    try {
      var resp = await fetch('/api/job?id=' + jobId);
      if (!resp.ok) continue;
      var job = await resp.json();
      if (job.status === 'done') {
        if (btn) { btn.disabled = false; btn.textContent = '🔄 立即扫描'; }
        renderContent();
        return;
      }
      if (job.status === 'error') {
        alert('扫描出错: ' + (job.error || '未知错误'));
        return;
      }
    } catch (e) { /* continue polling */ }
  }
  alert('扫描超时，请稍后重试');
}

async function confirmTopic(topicTitle) {
  if (!confirm('确认写作"' + topicTitle + '"？将启动多模型并行分析')) return;
  try {
    var resp = await fetch('/api/recommendation/confirm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ topic: topicTitle }),
    });
    var data = await resp.json();
    if (data.job_id) {
      alert('✅ 已启动多模型分析！\n话题: ' + topicTitle + '\n任务ID: ' + data.job_id + '\n\n请前往"AI 分析报告"查看进度。');
      switchView('analysis');
    }
  } catch (e) {
    alert('启动失败: ' + e.message);
  }
}

async function skipTopic(topicTitle) {
  try {
    await fetch('/api/recommendation/skip', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ topic: topicTitle }),
    });
    renderContent();
  } catch (e) {
    alert('操作失败: ' + e.message);
  }
}

function renderCommentHelper() {
  var content = document.getElementById('content');
  content.innerHTML =
    '<div class="section-bar"><h3>评论增长助手</h3></div>' +
    '<div class="ai-panel"><div class="ai-panel-body open">' +
    '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.7">' +
    '在竞品或相关公众号文章下留有深度的评论，展示专业思考而非引流。' +
    'AI 会生成 3 条不同角度的差异化评论供你选择，直接复制粘贴即可。</p>' +
    '<div style="display:flex;flex-direction:column;gap:10px;max-width:600px">' +
    '<input id="cmt-title" placeholder="目标文章标题" style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px">' +
    '<input id="cmt-author" placeholder="公众号名称（可选）" style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px">' +
    '<textarea id="cmt-summary" placeholder="文章关键内容摘要（粘贴几个要点即可，越详细评论越精准）" rows="4" style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;resize:vertical"></textarea>' +
    '<input id="cmt-url" placeholder="文章链接（可选）" style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px">' +
    '<button class="btn btn-primary" id="gen-comment-btn" onclick="generateComments()">&#128172; 生成差异化评论</button>' +
    '</div>' +
    '</div></div>' +
    '<div id="comment-results" style="margin-top:16px"></div>';
}

async function generateComments() {
  var title = document.getElementById('cmt-title').value.trim();
  if (!title) { alert('请输入文章标题'); return; }

  var btn = document.getElementById('gen-comment-btn');
  btn.disabled = true;
  btn.textContent = '生成中...';

  try {
    var resp = await fetch('/api/generate-comments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title: title,
        author: document.getElementById('cmt-author').value.trim(),
        summary: document.getElementById('cmt-summary').value.trim(),
        url: document.getElementById('cmt-url').value.trim(),
      })
    });
    var data = await resp.json();
    if (data.job_id) {
      pollCommentJob(data.job_id);
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '&#128172; 生成差异化评论';
    alert('失败: ' + e.message);
  }
}

function pollCommentJob(jobId) {
  var interval = setInterval(async function() {
    try {
      var resp = await fetch('/api/job?id=' + jobId);
      var job = await resp.json();
      if (job.status === 'done') {
        clearInterval(interval);
        var btn = document.getElementById('gen-comment-btn');
        if (btn) { btn.disabled = false; btn.innerHTML = '&#128172; 生成差异化评论'; }
        showCommentResults(job.result);
      } else if (job.status === 'error') {
        clearInterval(interval);
        var btn = document.getElementById('gen-comment-btn');
        if (btn) { btn.disabled = false; btn.innerHTML = '&#128172; 生成差异化评论'; }
        alert('生成失败: ' + (job.error || '未知错误'));
      }
    } catch(e) {}
  }, 2000);
}

function showCommentResults(result) {
  var container = document.getElementById('comment-results');
  if (!container) return;

  var comments = result.comments || [];
  var html = '<div class="section-bar"><h3>生成结果</h3>' +
    '<span class="count">' + comments.length + ' 条评论 · ' + (result.generation_time || 0) + 's</span></div>';

  comments.forEach(function(c, idx) {
    var angleColors = {
      '实践者视角': 'var(--accent)',
      '技术视角': 'var(--cyan)',
      '商业视角': 'var(--orange)',
      '补充视角': 'var(--green)',
      '反思视角': 'var(--purple)',
    };
    var color = 'var(--accent)';
    for (var key in angleColors) {
      if ((c.angle || '').includes(key.replace('视角',''))) { color = angleColors[key]; break; }
    }

    html += '<div class="news-card" style="flex-direction:column;align-items:stretch;gap:10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<div style="display:flex;gap:8px;align-items:center">' +
      '<span style="background:' + color + ';color:#fff;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600">评论 ' + (idx+1) + '</span>' +
      '<span style="font-size:13px;color:var(--text-secondary);font-weight:500">' + escapeHtml(c.angle || '') + '</span>' +
      '</div>' +
      '<button class="btn" onclick="copyComment(' + idx + ')">&#128203; 复制</button>' +
      '</div>' +
      '<div id="comment-text-' + idx + '" style="font-size:15px;line-height:1.8;color:var(--text);padding:8px 0;border-top:1px solid var(--border-light)">' +
      escapeHtml(c.content || '') +
      '</div>' +
      '<div style="font-size:12px;color:var(--text-muted);padding-top:4px;border-top:1px solid var(--border-light)">' +
      '&#128161; ' + escapeHtml(c.expected_effect || '') +
      '</div></div>';
  });

  container.innerHTML = html;
}

function copyComment(idx) {
  var el = document.getElementById('comment-text-' + idx);
  if (el) {
    navigator.clipboard.writeText(el.textContent).then(function() {
      alert('评论已复制到剪贴板，直接粘贴到公众号评论区即可');
    });
  }
}

document.getElementById('search').addEventListener('input', function(e) {
  searchQuery = e.target.value;
  renderContent();
});

loadAll();
updateNavVisibility();
setInterval(loadAll, 5 * 60 * 1000);
</script>
