<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Radar - AI 资讯雷达</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root {
  --bg: #f8f9fb;
  --bg-card: #ffffff;
  --bg-card-hover: #f0f4ff;
  --bg-sidebar: #ffffff;
  --bg-active: #eef2ff;
  --border: #e5e7eb;
  --border-light: #f0f0f5;
  --text: #1a1a2e;
  --text-secondary: #4b5563;
  --text-muted: #9ca3af;
  --accent: #3b82f6;
  --accent-light: #dbeafe;
  --accent-dark: #2563eb;
  --green: #059669;
  --green-bg: #ecfdf5;
  --orange: #d97706;
  --orange-bg: #fffbeb;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --purple: #7c3aed;
  --purple-bg: #f5f3ff;
  --pink: #db2777;
  --cyan: #0891b2;
  --cyan-bg: #ecfeff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  overflow-wrap: break-word;
  word-break: break-word;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-dark); }
button { font-family: inherit; }

/* ---- LAYOUT ---- */
.layout { display: flex; min-height: 100vh; }

/* ---- SIDEBAR ---- */
.sidebar {
  width: 180px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 10;
  display: flex;
  flex-direction: column;
}
.sidebar-logo {
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--border-light);
}
.sidebar-logo h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sidebar-logo h1 .logo-icon {
  width: 22px; height: 22px;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 12px;
}
.sidebar-logo .subtitle {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  margin-left: 28px;
}
.sidebar nav {
  flex: 1;
  padding: 8px 6px;
}
.nav-group { margin-bottom: 14px; }
.nav-group-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  padding: 4px 10px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all .15s;
  user-select: none;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active {
  background: var(--bg-active);
  color: var(--accent);
  font-weight: 600;
}
.nav-item .icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto;
  background: var(--accent-light);
  color: var(--accent);
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 600;
}
.nav-item .badge.ai {
  background: var(--green-bg);
  color: var(--green);
}
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border-light);
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
}

/* ---- MAIN ---- */
.main {
  margin-left: 180px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-width: 0;
  overflow-x: hidden;
}
.main-scroll {
  flex: 1;
  padding: 20px 28px;
  width: 100%;
  min-width: 0;
}

/* ---- HEADER ---- */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.header-left h2 { font-size: 22px; font-weight: 700; }
.header-left .meta { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.search-box {
  display: flex;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 12px;
  gap: 8px;
  transition: border-color .15s;
}
.search-box:focus-within { border-color: var(--accent); }
.search-box .search-icon { color: var(--text-muted); font-size: 14px; }
.search-box input {
  background: none;
  border: none;
  color: var(--text);
  font-size: 13px;
  padding: 8px 0;
  width: 200px;
  outline: none;
}
.search-box input::placeholder { color: var(--text-muted); }
.btn {
  padding: 7px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }

/* ---- STATS ---- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
}
.stat-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
.stat-card .value { font-size: 28px; font-weight: 700; color: var(--text); }
.stat-card .sub { font-size: 12px; color: var(--green); margin-top: 2px; }

/* ---- TAGS ---- */
.tags-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.tag-chip {
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  transition: all .15s;
  font-weight: 500;
}
.tag-chip:hover { border-color: var(--accent); color: var(--accent); }
.tag-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ---- NEWS LIST ---- */
.section-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.section-bar h3 { font-size: 15px; font-weight: 600; color: var(--text); }
.section-bar .count { font-size: 13px; color: var(--text-muted); }
.section-bar .date-range { font-size: 12px; font-weight: 400; color: var(--text-muted); background: var(--border); padding: 1px 7px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }

/* ---- DATE NAV BAR ---- */
.date-nav { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.date-nav .date-btn {
  padding: 4px 12px; border-radius: 16px; border: 1px solid var(--border);
  font-size: 13px; cursor: pointer; background: var(--bg-card); color: var(--text-muted);
  transition: all .15s; white-space: nowrap;
}
.date-nav .date-btn:hover { border-color: var(--accent); color: var(--accent); }
.date-nav .date-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.date-nav .date-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

/* ---- ENGAGEMENT STATS ---- */
.engagement-stats { display: inline-flex; gap: 10px; font-size: 11px; color: var(--text-muted); margin-left: 8px; }
.engagement-stats span { display: inline-flex; align-items: center; gap: 2px; }

/* ---- MODEL GRID (自适应列数) ---- */
.model-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.model-col { min-width: 0; }
.model-col .model-card { margin-bottom: 0 !important; }

/* ---- INSPIRE GRID (自适应) ---- */
.inspire-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 0;
}
.inspire-card {
  padding: 12px 14px;
  border-bottom: 1px solid #f5d0fe;
  border-right: 1px solid #f5d0fe;
}
.inspire-card:last-child { border-right: none; }
.inspire-card:nth-child(2n) { border-right: none; }
.inspire-row {
  font-size: 11px; padding: 5px 8px; background: white;
  border-radius: 4px; margin-bottom: 4px;
  border-left: 3px solid #ddd;
  line-height: 1.55;
}
@media (max-width: 768px) {
  .model-grid { grid-template-columns: 1fr; }
  .inspire-grid { grid-template-columns: 1fr; }
  .inspire-card { border-right: none; }
}

/* ---- 紧凑模型卡 ---- */
.model-card-compact .insight-row { padding: 6px 8px; border-bottom: 1px solid #f1f5f9; }
.model-card-compact .insight-title { font-size: 12px; font-weight: 700; line-height: 1.35; margin-bottom: 2px; }
.model-card-compact .insight-thesis { font-size: 11px; color: var(--text-secondary); line-height: 1.45; margin-bottom: 3px; }
.model-card-compact .insight-meta { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 2px; }
.model-card-compact .insight-meta span { font-size: 10px; padding: 0px 5px; border-radius: 8px; }
.model-card-compact .insight-block { font-size: 10px; padding: 4px 7px; border-radius: 4px; margin-bottom: 2px; line-height: 1.45; border-left: 2px solid; }
.model-card-compact .ev-item { font-size: 10px; padding: 3px 6px; margin-bottom: 2px; background: #fafafa; border-radius: 4px; border: 1px solid #f1f5f9; line-height: 1.4; }

.news-list { display: flex; flex-direction: column; gap: 6px; }
.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 10px;
}
.news-grid .news-card { flex-direction: column; gap: 8px; }
.news-grid .news-card .news-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.news-grid .news-card .ai-score { margin-left: auto; }
.ai-select-bar {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: white; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
  border-radius: 10px; margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(59,130,246,0.3);
}
.news-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  transition: all .15s;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.news-card:hover {
  background: var(--bg-card-hover);
  border-color: #c7d2fe;
  box-shadow: var(--shadow-md);
}
.news-card.picked {
  border-left: 3px solid var(--accent);
  background: #fafbff;
}

.news-rank {
  min-width: 26px; height: 26px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}
.news-rank.top1 { background: var(--red); color: #fff; }
.news-rank.top2 { background: var(--orange); color: #fff; }
.news-rank.top3 { background: var(--accent); color: #fff; }
.news-rank.normal { background: #f3f4f6; color: var(--text-muted); }

.news-body { flex: 1; min-width: 0; }
.news-title {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  margin-bottom: 5px;
  color: var(--text);
  cursor: pointer;
}
.news-title:hover { color: var(--accent); }
.news-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.news-source {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--accent-light);
  border-radius: 4px;
  color: var(--accent);
  font-weight: 500;
  font-size: 11px;
}
.news-tag {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.news-tag.agent { background: var(--purple-bg); color: var(--purple); }
.news-tag.model { background: var(--accent-light); color: var(--accent); }
.news-tag.tool { background: var(--cyan-bg); color: var(--cyan); }
.news-tag.biz { background: var(--orange-bg); color: var(--orange); }
.news-tag.open { background: var(--green-bg); color: var(--green); }
.news-tag.data { background: #fdf2f8; color: var(--pink); }
.news-tag.safety { background: var(--red-bg); color: var(--red); }

.news-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.pick-btn {
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.pick-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.pick-btn.picked {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.ai-score {
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
}
.ai-score.high { background: var(--green-bg); color: var(--green); }
.ai-score.medium { background: var(--orange-bg); color: var(--orange); }
.ai-score.low { background: #f3f4f6; color: var(--text-muted); }

.rss-summary {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.5;
}

/* ---- TOPIC WORKBENCH ---- */
.topic-bench {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  display: none;
}
.topic-bench.visible { display: block; }
.topic-bench-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.topic-bench-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.topic-bench-header .count-badge {
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 10px;
}
.topic-items {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.topic-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--accent-light);
  color: var(--accent-dark);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
}
.topic-item .remove {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: none;
  background: rgba(59,130,246,0.15);
  color: var(--accent);
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.topic-item .remove:hover { background: var(--red); color: #fff; }

/* ---- AI ANALYSIS PANEL ---- */
.ai-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.ai-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  user-select: none;
}
.ai-panel-header h3 {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ai-panel-header .toggle { color: var(--text-muted); font-size: 14px; transition: transform .2s; }
.ai-panel-header .toggle.open { transform: rotate(180deg); }
.ai-panel-body {
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height .3s ease, padding .3s ease;
}
.ai-panel-body.open {
  max-height: none;
  overflow: visible;
  padding: 20px;
  transition: none;
}
.ai-panel-body iframe {
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #fff;
}
.ai-report-content {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-secondary);
}
.ai-report-content h1, .ai-report-content h2, .ai-report-content h3 {
  color: var(--text);
  margin: 16px 0 8px;
}
.ai-report-content p { margin-bottom: 8px; }
.ai-report-content ul, .ai-report-content ol {
  padding-left: 20px;
  margin-bottom: 8px;
}

/* ---- EMPTY ---- */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

/* ---- RESPONSIVE ---- */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .main-scroll { padding: 16px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1><span class="logo-icon">R</span> AI Radar</h1>
      <div class="subtitle">AI 资讯雷达 &middot; 内容工作台</div>
    </div>
    <nav>
      <div class="nav-group">
        <div class="nav-group-title">概览</div>
        <div class="nav-item active" data-view="overview">
          <span class="icon">&#127968;</span>今日概览
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">资讯</div>
        <div class="nav-item" data-view="all">
          <span class="icon">&#9889;</span>全量资讯
          <span class="badge" id="total-badge">0</span>
        </div>
        <div class="nav-item" data-view="ai">
          <span class="icon">&#10024;</span>AI 精选
          <span class="badge ai" id="ai-badge">0</span>
        </div>
        <div class="nav-item" data-view="hot">
          <span class="icon">&#128293;</span>热榜
        </div>
        <div class="nav-item" data-view="rss">
          <span class="icon">&#128225;</span>RSS 订阅
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">工作台</div>
        <div class="nav-item" data-view="picks">
          <span class="icon">&#128204;</span>选题池
          <span class="badge" id="picks-badge" style="display:none">0</span>
        </div>
        <div class="nav-item" data-view="analysis">
          <span class="icon">&#128202;</span>内容生产线
        </div>
        <div class="nav-item" data-view="archive">
          <span class="icon">&#128451;</span>创作归档
        </div>
        <div class="nav-item" data-view="data">
          <span class="icon">&#128200;</span>数据追踪
        </div>
        <div class="nav-item" data-view="competitors">
          <span class="icon">&#128065;</span>竞品监控
        </div>
        <div class="nav-item" data-view="comments">
          <span class="icon">&#128172;</span>评论助手
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">视频工作台</div>
        <div class="nav-item" data-view="video">
          <span class="icon">&#127909;</span>视频脚本
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">管控台</div>
        <div class="nav-item" data-view="console">
          <span class="icon">&#127919;</span>全局管控台
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">信源</div>
        <div id="source-nav"></div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">

        <div class="header-left">

          <div class="meta" id="page-meta">加载中...</div>

        <div class="header-actions">
          <div class="search-box">
            <span class="search-icon">&#128269;</span>
            <input type="text" id="search" placeholder="搜索关键词...">

        <div class="topic-bench-header">
          <h3>&#128204; 选题工作台 <span class="count-badge" id="topic-count">0</span></h3>
          <button class="btn btn-primary" id="start-analysis-btn" onclick="startAnalysis()" style="display:none">
            &#9889; 启动多模型分析
          </button>
        </div>

    </div>
  </main>
</div>

<script>
let allNews = [], allRss = [], aiFiltered = [];
let currentView = 'overview', currentTag = null, searchQuery = '';
let availableDates = [];
let aiDateFilter = 'recent'; // 'recent' | 'YYYY-MM-DD' | 'last-week' | 'last-30d'
let pickedTopics = JSON.parse(localStorage.getItem('ai-radar-picks') || '[]');

const TAG_COLORS = {
  'AI 大模型': 'model', 'AI Agent / 智能体': 'agent',
  'AI 应用 & 工具': 'tool', '开源 & 技术': 'open',
  'AI 产业 & 商业': 'biz', '数据 & 基础设施': 'data',
  'AI 安全 & 政策': 'safety'
};
const TAG_KEYWORDS = {
  'AI 大模型': ['claude','gpt','openai','anthropic','gemini','llm','大模型','chatgpt','agi','llama','qwen','deepseek','mistral','grok','xai','通义'],
  'AI Agent / 智能体': ['agent','智能体','数字员工','agentic','mcp','copilot','cursor','codex','claw','openclaw'],
  'AI 应用 & 工具': ['ai视频','sora','可灵','seedance','runway','ai图片','midjourney','stable diffusion','ai编程','ai写作','aigc'],
  '开源 & 技术': ['开源','github','huggingface','模型训练','微调','rag','向量数据库','推理优化'],
  'AI 产业 & 商业': ['ai创业','融资','api','算力','gpu','英伟达','nvidia'],
  '数据 & 基础设施': ['数据采集','数据标注','数据工程','爬虫'],
  'AI 安全 & 政策': ['ai安全','ai监管','ai伦理']
};

// 后端 ai_tags → 前端标签映射（后端返回的标签名可能不同于前端分类名）
const BACKEND_TAG_MAP = {
  '大模型动态': 'AI 大模型', '大模型': 'AI 大模型', 'LLM': 'AI 大模型',
  'AI智能体': 'AI Agent / 智能体', 'AI Agent': 'AI Agent / 智能体', '智能体': 'AI Agent / 智能体',
  'AI应用实战': 'AI 应用 & 工具', 'AI应用': 'AI 应用 & 工具', 'AI工具': 'AI 应用 & 工具',
  '开源与技术前沿': '开源 & 技术', '开源技术': '开源 & 技术', '技术前沿': '开源 & 技术',
  'AI创业与商业': 'AI 产业 & 商业', 'AI创业商业': 'AI 产业 & 商业', 'AI产业': 'AI 产业 & 商业', 'AI商业': 'AI 产业 & 商业',
  '数据工程': '数据 & 基础设施', '基础设施': '数据 & 基础设施', '算力': '数据 & 基础设施',
  'AI安全与政策': 'AI 安全 & 政策', 'AI安全': 'AI 安全 & 政策', 'AI监管': 'AI 安全 & 政策',
};

function mapBackendTag(backendTag) {
  if (!backendTag) return null;
  return BACKEND_TAG_MAP[backendTag] || null;
}

function classifyTitle(title) {
  const t = title.toLowerCase();
  for (const [tag, keywords] of Object.entries(TAG_KEYWORDS)) {
    for (const kw of keywords) {
      if (t.includes(kw.toLowerCase())) return tag;
    }
  }
  return null;
}

async function fetchJSON(url) {
  try {
    const r = await fetch(url);
    return r.ok ? r.json() : [];
  } catch { return []; }
}

async function loadAll() {
  const [news, rss, stats, filtered, dates] = await Promise.all([
    fetchJSON('/api/news'),
    fetchJSON('/api/rss'),
    fetchJSON('/api/stats'),
    fetchJSON('/api/ai-filtered'),
    fetchJSON('/api/dates'),
  ]);
  allNews = news;
  allRss = rss;
  aiFiltered = Array.isArray(filtered) ? filtered : [];
  availableDates = Array.isArray(dates) ? dates : [];
  renderStats(stats);
  renderSourceNav(stats);
  renderTags();
  renderContent();
  renderTopicBench();
  loadAIAnalysis();
  const s = typeof stats === 'object' && stats.date ? stats : { date: new Date().toISOString().slice(0,10), news_total: 0, rss_total: 0 };
  document.getElementById('page-meta').textContent =
    s.date + ' \u00b7 热榜 ' + s.news_total + ' 条 \u00b7 RSS ' + s.rss_total + ' 条 \u00b7 每30分钟更新';
  document.getElementById('total-badge').textContent = s.news_total + s.rss_total;
  document.getElementById('ai-badge').textContent = aiFiltered.length;
}

function renderStats(s) {
  if (!s || typeof s !== 'object') return;
  const platforms = s.platforms ? Object.keys(s.platforms).length : 0;
  const feeds = s.feeds ? Object.keys(s.feeds).length : 0;
  document.getElementById('stats-row').innerHTML =
    '<div class="stat-card">' +
    '  <div class="label">热榜新闻</div>' +
    '  <div class="value">' + (s.news_total || 0) + '</div>' +
    '  <div class="sub">' + platforms + ' 个平台</div>' +
    '</div>' +
    '<div class="stat-card">' +
    '  <div class="label">RSS 资讯</div>' +
    '  <div class="value">' + (s.rss_total || 0) + '</div>' +
    '  <div class="sub">' + feeds + ' 个信源</div>' +
    '</div>' +
    '<div class="stat-card">' +
    '  <div class="label">AI 精选</div>' +
    '  <div class="value" style="color:var(--green)">' + aiFiltered.length + '</div>' +
    '  <div class="sub">近3天 · 相关度≥0.7</div>' +
    '</div>' +
    '<div class="stat-card">' +
    '  <div class="label">最近更新</div>' +
    '  <div class="value" style="font-size:16px">' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) + '</div>' +
    '  <div class="sub">自动采集中</div>' +
    '</div>';
}

function renderSourceNav(s) {
  if (!s || typeof s !== 'object') return;
  let html = '';
  if (s.platforms) {
    for (const [name, count] of Object.entries(s.platforms)) {
      html += '<div class="nav-item" data-view="source:' + name + '">' +
        '<span class="icon">&#128240;</span>' + name +
        '<span class="badge">' + count + '</span></div>';
    }
  }
  if (s.feeds) {
    for (const [name, count] of Object.entries(s.feeds)) {
      html += '<div class="nav-item" data-view="feed:' + name + '">' +
        '<span class="icon">&#128225;</span>' + name +
        '<span class="badge">' + count + '</span></div>';
    }
  }
  document.getElementById('source-nav').innerHTML = html;
  bindNavClicks();
}

function bindNavClicks() {
  document.querySelectorAll('.nav-item[data-view]').forEach(function(el) {
    el.onclick = function() {
      document.querySelectorAll('.nav-item').forEach(function(e) { e.classList.remove('active'); });
      el.classList.add('active');
      currentView = el.dataset.view;
      currentTag = null;
      renderTags();
      renderContent();
      var titles = { all:'全量资讯', ai:'AI 精选', hot:'热榜', rss:'RSS 订阅', picks:'选题池', analysis:'内容生产线', data:'数据追踪', competitors:'竞品监控', comments:'评论助手', video:'视频脚本', console:'全局管控台' };
      document.getElementById('page-title').textContent =
        titles[currentView] || currentView.replace('source:','').replace('feed:','');
    };
  });
}

function switchView(view) {
  document.querySelectorAll('.nav-item').forEach(function(e) { e.classList.remove('active'); });
  var target = document.querySelector('.nav-item[data-view="' + view + '"]');
  if (target) target.classList.add('active');
  currentView = view;
  currentTag = null;
  // 恢复 stats-row 和 meta 的显示（analysis/overview 页面会自行隐藏）
  var hideStatsViews = ['analysis', 'overview', 'data', 'picks', 'competitors', 'comments', 'video', 'console'];
  document.getElementById('stats-row').style.display = hideStatsViews.includes(view) ? 'none' : '';
  document.getElementById('page-meta').style.display = hideStatsViews.includes(view) ? 'none' : '';
  renderTags();
  renderContent();
  var titles = { overview:'今日概览', all:'全量资讯', ai:'AI 精选', hot:'热榜', rss:'RSS 订阅', picks:'选题池', analysis:'内容生产线', data:'数据追踪', competitors:'竞品监控', comments:'评论助手', video:'视频脚本', console:'全局管控台' };
  document.getElementById('page-title').textContent = titles[view] || view;
}

function renderTags() {
  if (['picks','analysis','overview','data','competitors','comments','video','console'].includes(currentView)) {
    document.getElementById('tags-bar').innerHTML = '';
    return;
  }
  var tags = Object.keys(TAG_COLORS);
  var html = '<div class="tag-chip ' + (!currentTag?'active':'') + '" onclick="setTag(null)">全部</div>';
  for (var i = 0; i < tags.length; i++) {
    var t = tags[i];
    html += '<div class="tag-chip ' + (currentTag===t?'active':'') + '" onclick="setTag(\'' + t + '\')">' + t + '</div>';
  }
  document.getElementById('tags-bar').innerHTML = html;
}

function setTag(t) {
  currentTag = t;
  renderTags();
  renderContent();
}

function renderDateNav() {
  var today = new Date().toISOString().slice(0,10);
  var html = '<div class="date-nav">';

  // "近3天" 按钮
  html += '<div class="date-btn' + (aiDateFilter==='recent'?' active':'') + '" onclick="switchAiDate(\'recent\')">近3天</div>';
  html += '<div class="date-sep"></div>';

  // 最近7天，每天一个按钮
  for (var i = 0; i < 7; i++) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var ds = d.toISOString().slice(0,10);
    if (availableDates.indexOf(ds) === -1) continue;
    var label = i === 0 ? '今天' : i === 1 ? '昨天' : (d.getMonth()+1) + '/' + d.getDate();
    var weekday = ['日','一','二','三','四','五','六'][d.getDay()];
    if (i >= 2) label += ' ' + weekday;
    html += '<div class="date-btn' + (aiDateFilter===ds?' active':'') + '" onclick="switchAiDate(\'' + ds + '\')">' + label + '</div>';
  }
  html += '<div class="date-sep"></div>';

  // 上周 和 近30天
  html += '<div class="date-btn' + (aiDateFilter==='last-week'?' active':'') + '" onclick="switchAiDate(\'last-week\')">上周</div>';
  html += '<div class="date-btn' + (aiDateFilter==='last-30d'?' active':'') + '" onclick="switchAiDate(\'last-30d\')">近30天</div>';

  html += '</div>';
  return html;
}

async function switchAiDate(filter) {
  aiDateFilter = filter;
  if (filter === 'recent') {
    // 默认近3天聚合
    aiFiltered = await fetchJSON('/api/ai-filtered');
  } else if (filter === 'last-week') {
    // 上周的所有数据聚合
    var items = [];
    var seen = {};
    var d = new Date();
    var dayOfWeek = d.getDay() || 7;
    var lastMonday = new Date(d); lastMonday.setDate(d.getDate() - dayOfWeek - 6);
    for (var i = 0; i < 7; i++) {
      var dd = new Date(lastMonday); dd.setDate(lastMonday.getDate() + i);
      var ds = dd.toISOString().slice(0,10);
      if (availableDates.indexOf(ds) >= 0) {
        var dayItems = await fetchJSON('/api/ai-filtered?date=' + ds);
        dayItems.forEach(function(it) {
          if (!seen[it.title]) { seen[it.title] = true; it.data_date = ds; items.push(it); }
        });
      }
    }
    items.sort(function(a,b) { return (b.ai_score||0) - (a.ai_score||0); });
    aiFiltered = items;
  } else if (filter === 'last-30d') {
    // 近30天聚合
    var items = [];
    var seen = {};
    for (var i = 0; i < 30; i++) {
      var dd = new Date(); dd.setDate(dd.getDate() - i);
      var ds = dd.toISOString().slice(0,10);
      if (availableDates.indexOf(ds) >= 0) {
        var dayItems = await fetchJSON('/api/ai-filtered?date=' + ds);
        dayItems.forEach(function(it) {
          if (!seen[it.title]) { seen[it.title] = true; it.data_date = ds; items.push(it); }
        });
      }
    }
    items.sort(function(a,b) { return (b.ai_score||0) - (a.ai_score||0); });
    aiFiltered = items;
  } else {
    // 具体某一天
    aiFiltered = await fetchJSON('/api/ai-filtered?date=' + filter);
    aiFiltered.forEach(function(it) { it.data_date = filter; });
  }
  renderContent();
}

async function toggleTrendChart(itemId, dateStr) {
  var el = document.getElementById('trend-chart-' + itemId);
  if (!el) return;
  if (el.style.display !== 'none') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<div style="padding:6px;font-size:11px;color:var(--text-muted)">加载热度数据...</div>';
  try {
    var url = '/api/engagement?item_id=' + itemId;
    if (dateStr) url += '&date=' + dateStr;
    var resp = await fetch(url);
    var data = await resp.json();
    if (!data || data.length === 0) {
      el.innerHTML = '<div style="padding:6px;font-size:11px;color:var(--text-muted)">暂无热度数据</div>';
      return;
    }
    // 绘制简单的 ASCII/CSS 热度曲线
    var maxV = Math.max.apply(null, data.map(function(d) { return d.views || 0; }));
    if (maxV === 0) maxV = 1;
    var chartHtml = '<div style="padding:6px 8px;background:#fafbfc;border:1px solid #e5e7eb;border-radius:6px;margin-top:4px">' +
      '<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">📈 热度趋势（排名越高=热度越高）</div>' +
      '<div style="display:flex;align-items:flex-end;gap:1px;height:32px">';
    for (var i = 0; i < data.length; i++) {
      var v = data[i].views || 0;
      var pct = Math.round((v / maxV) * 100);
      var t = (data[i].snapshot_time || '').replace(/^(\d{2})-(\d{2})$/, '$1:$2');
      var barColor = pct >= 80 ? '#ef4444' : pct >= 50 ? '#f59e0b' : '#3b82f6';
      chartHtml += '<div title="' + t + ': ' + v + '" style="flex:1;min-width:3px;background:' + barColor + ';height:' + Math.max(2, pct) + '%;border-radius:1px 1px 0 0"></div>';
    }
    chartHtml += '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);margin-top:2px">' +
      '<span>' + (data[0].snapshot_time || '').replace(/^(\d{2})-(\d{2})$/, '$1:$2') + '</span>' +
      '<span>' + (data[data.length-1].snapshot_time || '').replace(/^(\d{2})-(\d{2})$/, '$1:$2') + '</span>' +
      '</div></div>';
    el.innerHTML = chartHtml;
  } catch(e) {
    el.innerHTML = '<div style="padding:6px;font-size:11px;color:red">加载失败: ' + e.message + '</div>';
  }
}

function isPicked(title) {
  return pickedTopics.some(function(p) { return p.title === title; });
}

function togglePick(title, url, source) {
  if (isPicked(title)) {
    pickedTopics = pickedTopics.filter(function(p) { return p.title !== title; });
  } else {
    pickedTopics.push({ title: title, url: url, source: source, time: new Date().toISOString() });
  }
  localStorage.setItem('ai-radar-picks', JSON.stringify(pickedTopics));
  renderContent();
  renderTopicBench();
}

function removePick(title) {
  pickedTopics = pickedTopics.filter(function(p) { return p.title !== title; });
  localStorage.setItem('ai-radar-picks', JSON.stringify(pickedTopics));
  renderContent();
  renderTopicBench();
}

function renderTopicBench() {
  var bench = document.getElementById('topic-bench');
  var badge = document.getElementById('picks-badge');
  if (pickedTopics.length === 0) {
    bench.classList.remove('visible');
    badge.style.display = 'none';
    return;
  }
  bench.classList.add('visible');
  badge.style.display = '';
  badge.textContent = pickedTopics.length;
  document.getElementById('topic-count').textContent = pickedTopics.length;
  document.getElementById('start-analysis-btn').style.display = pickedTopics.length > 0 ? '' : 'none';
  var html = '';
  for (var i = 0; i < pickedTopics.length; i++) {
    var p = pickedTopics[i];
    html += '<div class="topic-item">' +
      '<span>' + escapeHtml(p.title.substring(0, 40)) + (p.title.length > 40 ? '...' : '') + '</span>' +
      '<button class="remove" onclick="removePick(\'' + escapeJs(p.title) + '\')">&times;</button>' +
      '</div>';
  }
  document.getElementById('topic-items').innerHTML = html;
}

// 选题后更新顶部计数器（不刷新整个页面）
function togglePickAndUpdate(title, url, source) {
  togglePick(title, url, source);
  var el = document.getElementById('ai-pick-count');
  if (el) el.textContent = '已选 ' + pickedTopics.length + ' 条';
  // 更新当前卡片外观
  var allCards = document.querySelectorAll('.news-card');
  allCards.forEach(function(card) {
    var btn = card.querySelector('.pick-btn[onclick*="togglePickAndUpdate"]');
    if (!btn) return;
    var isNowPicked = pickedTopics.some(function(p) { return btn.getAttribute('onclick').indexOf(escapeJs(p.title)) >= 0; });
    btn.textContent = isNowPicked ? '✓ 已选' : '＋ 选题';
    btn.classList.toggle('picked', isNowPicked);
    card.classList.toggle('picked', isNowPicked);
  });
}

// 批量分析所有已选题
async function analyzeAllPicked() {
  if (pickedTopics.length === 0) {
    alert('请先在下方卡片点「＋ 选题」选择感兴趣的话题，再点此按钮分析。');
    return;
  }
  if (!confirm('将对 ' + pickedTopics.length + ' 个话题启动多模型分析：\n\n' +
    pickedTopics.slice(0,5).map(function(p){ return '• ' + p.title.substring(0,40); }).join('\n') +
    (pickedTopics.length > 5 ? '\n... 等' : '') +
    '\n\n每个话题约需 1-3 分钟，将并行启动。')) return;
  var started = 0;
  for (var i = 0; i < pickedTopics.length; i++) {
    var p = pickedTopics[i];
    try {
      var resp = await fetch('/api/start-analysis', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ topic: p.title, context: p.url || '' })
      });
      var d = await resp.json();
      if (d.job_id || d.project_id) started++;
    } catch(e) {}
    await new Promise(function(r){ setTimeout(r, 300); }); // 稍微错开避免并发太高
  }
  alert('已启动 ' + started + '/' + pickedTopics.length + ' 个话题的分析！\n可前往「内容生产线」查看进度。');
  pickedTopics = [];
  localStorage.setItem('ai-radar-picks', JSON.stringify(pickedTopics));
  renderContent();
}

// 清空选题
function clearAllPicks() {
  pickedTopics = [];
  localStorage.setItem('ai-radar-picks', JSON.stringify(pickedTopics));
  var el = document.getElementById('ai-pick-count');
  if (el) el.textContent = '已选 0 条';
  renderContent();
}

async function quickAnalyze(topic) {
  if (!confirm('启动多模型分析：\n\n' + topic + '\n\n将使用 4 个模型并行分析，约需 1-3 分钟。')) return;
  try {
    var resp = await fetch('/api/start-analysis', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ topic: topic })
    });
    var data = await resp.json();
    if (data.job_id) {
      alert('✅ 分析已启动！任务ID: ' + data.job_id + '\n\n切换到「内容生产线」查看进度。');
      switchView('analysis');
    } else {
      alert('启动失败: ' + (data.error || ''));
    }
  } catch(e) {
    alert('请求失败: ' + e.message);
  }
}

async function startAnalysis() {
  if (pickedTopics.length === 0) return;
  var topic = pickedTopics.map(function(p) { return p.title; }).join('\n');
  var context = pickedTopics.map(function(p) {
    return p.title + (p.source ? ' (' + p.source + ')' : '');
  }).join('\n');

  document.getElementById('start-analysis-btn').disabled = true;
  document.getElementById('start-analysis-btn').textContent = '&#9889; 分析中...';

  try {
    var resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ topic: topic, context: context })
    });
    var data = await resp.json();
    if (data.job_id) {
      pollJob(data.job_id);
    }
  } catch(e) {
    alert('启动分析失败: ' + e.message);
    document.getElementById('start-analysis-btn').disabled = false;
    document.getElementById('start-analysis-btn').textContent = '&#9889; 启动多模型分析';
  }
}

function pollJob(jobId) {
  var interval = setInterval(async function() {
    try {
      var resp = await fetch('/api/job?id=' + jobId);
      var job = await resp.json();
      if (job.status === 'done') {
        clearInterval(interval);
        document.getElementById('start-analysis-btn').disabled = false;
        document.getElementById('start-analysis-btn').textContent = '&#9889; 启动多模型分析';
        if (job.type === 'analysis') {
          showAnalysisResult(job);
        } else if (job.type === 'article') {
          showArticleResult(job);
          // 文章生成完成后刷新生产线页面以更新 stage bar
          if (currentView === 'analysis') {
            setTimeout(function() { loadAIAnalysis(); }, 1500);
          }
        } else if (job.type === 'review') {
          showReviewResult(job);
          // 审核完成后刷新生产线页面以更新 stage bar
          if (currentView === 'analysis') {
            setTimeout(function() { loadAIAnalysis(); }, 1000);
          }
        }
      } else if (job.status === 'error') {
        clearInterval(interval);
        document.getElementById('start-analysis-btn').disabled = false;
        document.getElementById('start-analysis-btn').textContent = '&#9889; 启动多模型分析';
        alert('任务失败: ' + (job.error || '未知错误'));
      }
    } catch(e) {}
  }, 3000);
}

  var promptEl = document.getElementById('revision-prompt');

  if (!confirm('确认重新生成文章？' + (extraList.length > 0 ? '将根据你的 ' + extraList.length + ' 条修改指令 + 审核建议改进。' : '将根据审核建议自动改进。'))) return;

async function _doReviseArticle(articleFile, reviewFile, projectId, extraInstructions) {

    };
    if (extraInstructions && extraInstructions.length > 0) body.extra_instructions = extraInstructions;
    var resp = await fetch('/api/revise-article', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });

      pollJob(data.job_id);

function pollRepurposeJob(jobId, platform) {
  var labels = {video_script:'视频号脚本', zhihu_answer:'知乎回答', moments_snippet:'朋友圈文案'};
  var interval = setInterval(async function() {
    try {
      var resp = await fetch('/api/job?id=' + jobId);
      var job = await resp.json();
      if (job.status === 'done') {
        clearInterval(interval);
        var preview = document.getElementById('format-preview');
        if (!preview) return;
        var r = job.result || {};
        preview.innerHTML =
          '<div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:12px">' +
          '<div style="padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center">' +
          '<span style="font-size:13px;font-weight:600">' + escapeHtml(r.platform_label || platform) +
          ' <span style="color:var(--text-muted);font-weight:400">' + (r.word_count || 0) + ' 字 | ' + (r.generation_time || 0) + 's</span></span>' +
          '<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById(\'repurpose-content\').textContent);alert(\'已复制\')">&#128203; 复制</button>' +
          '</div>' +
          '<div id="repurpose-content" style="padding:16px;background:#fff;max-height:500px;overflow-y:auto;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word">' +
          escapeHtml(r.content || '') +
          '</div></div>';
      } else if (job.status === 'error') {
        clearInterval(interval);
        alert('生成失败: ' + (job.error || '未知错误'));
      }
    } catch(e) {}
  }, 3000);
}
